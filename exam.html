<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD-102 Certification Exam</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f4;--surface:#fff;--ink:#12262e;--mute:#5b6f78;--line:#cbd7dc;--accent:#0b6e8a;--ok:#1b7a43;--okbg:#e2f3e8;--bad:#a8321f;--badbg:#fbe6e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b20;--surface:#16262d;--ink:#e6eef1;--mute:#93a8b0;--line:#2c434c;--accent:#4fc0de;--ok:#6fd49a;--okbg:#143324;--bad:#ff9c88;--badbg:#3a1d17}}
:root[data-theme="dark"]{--bg:#0f1b20;--surface:#16262d;--ink:#e6eef1;--mute:#93a8b0;--line:#2c434c;--accent:#4fc0de;--ok:#6fd49a;--okbg:#143324;--bad:#ff9c88;--badbg:#3a1d17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Iowan Old Style",serif}
main{max-width:720px;margin:0 auto;padding:20px 18px 60px}
h1{font:700 28px/1.2 "Trebuchet MS",system-ui,sans-serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 22px}
.ui{font-family:"Trebuchet MS",system-ui,sans-serif}
.grid{display:grid;gap:10px}
.dom{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:6px;padding:14px 16px;font:600 17px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.dom small{font-weight:400;color:var(--mute);white-space:nowrap}
@media (hover:hover){.dom:hover{border-color:var(--accent)}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;color:var(--mute);font-size:14px}
.link{background:none;border:0;color:var(--accent);font:600 14px "Trebuchet MS",system-ui,sans-serif;cursor:pointer;padding:6px 0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 8px;margin-bottom:12px}
.q p{margin:0 0 14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:9px;font:16px/1.45 Georgia,serif;cursor:pointer}
.opt b{font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--accent);min-width:1.2em}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--accent)}}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.fb{border-radius:6px;padding:14px 16px;margin:4px 0 14px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{font-family:"Trebuchet MS",system-ui,sans-serif}
.primary{background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:12px 22px;font:700 16px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.score{font:700 44px/1 "Trebuchet MS",system-ui,sans-serif;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sec{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:11px 20px;font:700 16px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.mode{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.mode button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:7px 14px;font:14px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.mode button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}

.opt.sel{border-color:var(--accent);background:var(--surface);box-shadow:inset 5px 0 0 var(--accent)}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 14px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:14px 0}
.primary:disabled,.sec:disabled{opacity:.4;cursor:default}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.map button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:6px 0;font:13px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.map button.a{background:var(--accent);color:var(--bg);border-color:var(--accent)}.map button.c{outline:3px solid var(--ink)}
.warn{background:var(--badbg);border-radius:6px;padding:12px 16px;margin:10px 0}
.dr{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-family:"Trebuchet MS",system-ui,sans-serif;font-size:15px}
.tag{font:700 14px "Trebuchet MS",system-ui,sans-serif;margin:0 0 8px}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.map button,.mode button{min-height:44px}.opt,.dom,.primary,.sec{min-height:48px}
@media (min-width:768px){body{font-size:19px}main{max-width:860px;padding-top:32px;padding-bottom:90px;padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right))}h1{font-size:36px}.opt{font-size:19px;padding:16px 20px}.dom{font-size:19px;padding:20px 22px}.q{padding:24px 26px 12px}.map{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}}
@media (min-width:1000px){main{max-width:980px}.grid{grid-template-columns:1fr 1fr}}
.h2{font:700 20px "Trebuchet MS",system-ui,sans-serif;margin:26px 0 4px}
.brow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin:12px 0}
.bl{font:15px/1.3 "Trebuchet MS",system-ui,sans-serif}
.bt{height:24px;border:1px solid var(--line);background:var(--surface) linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/25% 100%}
.bt i{display:block;height:100%;background:var(--accent)}
.bn{font:13px/22px "Trebuchet MS",system-ui,sans-serif;color:var(--mute);padding:0 8px}
.bv{font:13px "Trebuchet MS",system-ui,sans-serif;color:var(--mute)}
.ax{display:flex;justify-content:space-between;font:13px "Trebuchet MS",system-ui,sans-serif;color:var(--mute)}
@media (min-width:768px){.brow{grid-template-columns:300px 1fr 56px;align-items:center;gap:14px}.bv{text-align:right}.ax{margin:0 70px 0 314px}}
</style></head><body><main id="app"></main>
<script>
const BANK=[{"id": "1-1", "exam": 1, "n": 1, "domain": "Manage and maintain devices", "question": "A company is deploying Windows 11 to 500 new devices using Windows Autopilot. The devices are already registered in Autopilot. You need to ensure that during OOBE the devices are joined to Microsoft Entra ID and automatically enrolled in Microsoft Intune without any user interaction. Which Autopilot deployment mode should you configure?", "options": {"A": "User-Driven mode with Microsoft Entra join", "B": "Self-Deploying mode", "C": "Pre-provisioned mode (White Glove)", "D": "User-Driven mode with Microsoft Entra hybrid join"}, "answer": ["B"], "explanation": "Self-Deploying mode performs device enrollment without any user interaction, ideal for shared or kiosk devices that must auto-enroll with no user credentials required during OOBE.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-2", "exam": 1, "n": 2, "domain": "Manage and maintain devices", "question": "You are preparing a Windows Autopilot deployment for a hybrid Microsoft Entra joined scenario. Users are working remotely and cannot connect to the corporate network directly. You need to ensure the devices can join the on-premises domain during Autopilot. What should you deploy to support this?", "options": {"A": "Microsoft Entra ID Application Proxy", "B": "Intune Connector for Active Directory on a domain-joined server with line-of-sight to domain controllers", "C": "Microsoft Entra Connect with password hash synchronization", "D": "Direct Access VPN gateway"}, "answer": ["B"], "explanation": "The Intune Connector for Active Directory is required for Microsoft Entra hybrid join via Autopilot. It must be installed on a server with line-of-sight to domain controllers to handle offline domain join.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-3", "exam": 1, "n": 3, "domain": "Manage and maintain devices", "question": "A company uses Microsoft Deployment Toolkit (MDT) integrated with Configuration Manager. You need to capture a reference image of Windows 11 that includes specific line-of-business applications. Which MDT task sequence type should you use for the capture phase?", "options": {"A": "Standard Client Task Sequence", "B": "Sysprep and Capture Task Sequence", "C": "Custom Task Sequence", "D": "Standard Client Replace Task Sequence"}, "answer": ["B"], "explanation": "The Sysprep and Capture Task Sequence runs Sysprep to generalize the image and then captures it to a WIM file, which is the correct approach for creating a deployable reference image.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-4", "exam": 1, "n": 4, "domain": "Manage and maintain devices", "question": "You are managing Windows Autopilot deployment profiles. Your company requires that during OOBE, end users skip the Privacy Settings page and the Cortana setup page, but they must still sign in with their corporate credentials. Which setting should you configure in the Autopilot deployment profile?", "options": {"A": "Set deployment mode to Self-Deploying", "B": "Enable 'Skip AD connectivity check'", "C": "Set 'Hide privacy settings' and 'Hide Cortana' in the OOBE settings", "D": "Configure a custom Out-of-Box Experience using a provisioning package"}, "answer": ["C"], "explanation": "Autopilot deployment profiles allow administrators to hide specific OOBE pages including Privacy Settings and Cortana setup while still requiring user sign-in with corporate credentials.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-5", "exam": 1, "n": 5, "domain": "Manage and maintain devices", "question": "Your organization needs to deploy Windows 11 to 200 devices that currently have Windows 10 installed. You want to perform an in-place upgrade with minimal user disruption and ensure all devices are tracked in Intune. Which method is the most appropriate?", "options": {"A": "Use Autopilot Reset to wipe and re-provision the devices", "B": "Create a Feature Update policy in Intune to deploy the Windows 11 upgrade", "C": "Re-image all devices using WDS (Windows Deployment Services)", "D": "Manually run the Windows 11 installation assistant on each device"}, "answer": ["B"], "explanation": "Feature Update policies in Intune allow administrators to roll out in-place OS upgrades to enrolled devices in a controlled, trackable manner without reimaging.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-6", "exam": 1, "n": 6, "domain": "Manage and maintain devices", "question": "A company wants to use Windows Autopilot for existing devices running Windows 10. The devices are NOT pre-registered in the Autopilot service. A technician needs to register them. What is the correct process to harvest and upload the hardware hash?", "options": {"A": "Run Get-AutopilotDiagnostics PowerShell cmdlet and email the output to Microsoft", "B": "Use the Get-WindowsAutoPilotInfo PowerShell script to collect hardware hashes and upload them via Microsoft Intune admin center", "C": "Export device information from Active Directory and import it into Intune", "D": "Run the Sysprep /oobe /generalize command, which automatically registers the device"}, "answer": ["B"], "explanation": "Get-WindowsAutoPilotInfo is the Microsoft-recommended script to collect hardware hashes from existing devices. Hashes are then uploaded via the Intune admin center or via CSV import.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-7", "exam": 1, "n": 7, "domain": "Manage and maintain devices", "question": "You are configuring a Windows Autopilot deployment profile and need to ensure devices are enrolled in a specific Intune enrollment group based on their department. The devices belong to different departments. What is the most scalable approach to assign different Autopilot profiles per department?", "options": {"A": "Create a single Autopilot profile and use Conditional Access to segment departments", "B": "Create separate Autopilot profiles and assign them to dynamic Microsoft Entra ID device groups based on the device's GroupTag attribute", "C": "Create separate profiles and manually assign each device to the correct profile", "D": "Use Intune enrollment restrictions to enforce department-specific profiles"}, "answer": ["B"], "explanation": "Group Tags in Autopilot allow devices to be automatically placed into dynamic Microsoft Entra ID groups, enabling automatic profile assignment at scale without manual intervention.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-8", "exam": 1, "n": 8, "domain": "Manage and maintain devices", "question": "You are planning a large deployment using Microsoft Deployment Toolkit (MDT). You need to ensure that target computers receive the correct task sequence based on their hardware model. Which MDT feature should you configure?", "options": {"A": "Boot Image Wizard", "B": "Selection Profiles", "C": "Database rules and Make/Model queries in CustomSettings.ini", "D": "Deployment Shares with separate WIM files per model"}, "answer": ["C"], "explanation": "MDT's CustomSettings.ini supports hardware-based rules using Make and Model queries via the database or rules engine, enabling model-specific task sequence and driver selection.", "skill": "Deploy and upgrade Windows clients"}, {"id": "1-9", "exam": 1, "n": 9, "domain": "Manage and maintain devices", "question": "A company is migrating from on-premises Group Policy to Microsoft Intune for device management. Administrators want to ensure that existing GPO settings are replicated in Intune with minimal manual effort. Which tool should you use?", "options": {"A": "Intune Policy Baseline Analyzer", "B": "Group Policy Analytics in Microsoft Intune", "C": "Microsoft Entra Connect", "D": "Microsoft Security Compliance Toolkit"}, "answer": ["B"], "explanation": "Group Policy Analytics in Intune allows you to import GPO backups and analyzes which settings are supported in Intune MDM, providing a migration mapping report.", "skill": "Plan and implement device configuration profiles"}, {"id": "1-10", "exam": 1, "n": 10, "domain": "Manage and maintain devices", "question": "You manage Windows 11 devices enrolled in Microsoft Intune. You need to configure a policy that prevents users from changing the device's time zone. Previously this was done via a GPO. Which Intune profile type should you use to replicate this setting?", "options": {"A": "Endpoint Security profile", "B": "Device Configuration > Settings Catalog profile", "C": "Device Compliance policy", "D": "Custom OMA-URI profile"}, "answer": ["B"], "explanation": "The Settings Catalog in Intune provides granular MDM settings mirroring many GPO settings, including time zone controls, using a searchable interface.", "skill": "Plan and implement device configuration profiles"}, {"id": "1-11", "exam": 1, "n": 11, "domain": "Prepare infrastructure for devices", "question": "Your organization has a mix of cloud-managed and co-managed Windows devices. For co-managed devices, you need Intune to manage Endpoint Protection policies while Configuration Manager manages all other workloads. What should you configure?", "options": {"A": "Set all workloads to Intune in Co-management settings", "B": "Set only the Endpoint Protection workload slider to Intune in the Co-management configuration", "C": "Unenroll devices from Configuration Manager and enroll them fully in Intune", "D": "Create a Device Filter in Intune targeting co-managed devices"}, "answer": ["B"], "explanation": "Co-management workload sliders allow selective control — individual workloads like Endpoint Protection can be moved to Intune independently without affecting other Configuration Manager workloads.", "skill": "Enroll devices to Microsoft Intune"}, {"id": "1-12", "exam": 1, "n": 12, "domain": "Manage and maintain devices", "question": "A user reports that their managed Windows 11 device is not receiving the latest Intune configuration policies. You check and the device has not synced in 5 days. Which action should you take first to force an immediate policy sync?", "options": {"A": "Re-enroll the device into Intune", "B": "Delete and recreate the device object in Microsoft Entra ID", "C": "Use the 'Sync' action from the Intune admin center device blade, or have the user initiate sync from the Settings app", "D": "Restart the Intune Management Extension service on the device"}, "answer": ["C"], "explanation": "The Sync action from Intune admin center (or user-initiated sync from Settings > Accounts > Access work or school) forces an immediate MDM check-in and policy refresh.", "skill": "Perform remote actions on devices"}, {"id": "1-13", "exam": 1, "n": 13, "domain": "Prepare infrastructure for devices", "question": "You need to create a dynamic device group in Microsoft Entra ID that automatically includes all Windows 11 devices enrolled in Intune that have a specific department attribute. Which dynamic membership rule property should you use to filter by operating system version?", "options": {"A": "deviceOSType -eq 'Windows' and deviceOSVersion -startsWith '10.0.2'", "B": "operatingSystem -eq 'Windows 11'", "C": "(device.deviceOSType -eq \"Windows\") and (device.deviceOSVersion -startsWith \"10.0.22\")", "D": "(device.operatingSystemVersion -startsWith \"11\") and (device.managementType -eq \"MDM\")"}, "answer": ["C"], "explanation": "Windows 11 builds use OS version strings starting with 10.0.22 (e.g., 10.0.22000+). Dynamic groups use device.deviceOSType and device.deviceOSVersion with the correct prefix.", "skill": "Add devices to Microsoft Entra ID"}, {"id": "1-14", "exam": 1, "n": 14, "domain": "Prepare infrastructure for devices", "question": "Your company wants to prevent users from enrolling personal (BYOD) Windows devices into Intune, while still allowing corporate-owned devices to enroll. Which Intune feature should you configure?", "options": {"A": "Conditional Access policy blocking personal devices", "B": "Enrollment restrictions: Device type restrictions configured to block personal Windows devices", "C": "Microsoft Entra ID device registration settings limiting registration to approved devices", "D": "Compliance policy with non-compliant action set to block access"}, "answer": ["B"], "explanation": "Device Type Restrictions in Intune enrollment settings can be configured to block personally owned Windows devices from enrolling while permitting corporate-owned devices.", "skill": "Enroll devices to Microsoft Intune"}, {"id": "1-15", "exam": 1, "n": 15, "domain": "Manage and maintain devices", "question": "You are configuring Intune device configuration profiles for Windows 11 devices. You need to configure settings that are not available in the built-in profile templates or Settings Catalog. What is the most appropriate approach?", "options": {"A": "Deploy a PowerShell script via Intune", "B": "Create a custom OMA-URI profile with the required CSP settings", "C": "Use Administrative Templates (ADMX) profile", "D": "Configure the settings via a Compliance policy"}, "answer": ["B"], "explanation": "Custom OMA-URI profiles allow configuration of any Windows MDM CSP setting not yet surfaced in built-in Intune templates or the Settings Catalog.", "skill": "Plan and implement device configuration profiles"}, {"id": "1-16", "exam": 1, "n": 16, "domain": "Prepare infrastructure for devices", "question": "A company has 1,000 Windows 11 devices managed by Intune. An Intune compliance policy marks devices as non-compliant if BitLocker is not enabled. You need to ensure non-compliant devices lose access to Microsoft 365 services after 3 days. What is the correct configuration?", "options": {"A": "Set a Conditional Access policy to block all non-compliant devices immediately", "B": "Configure a non-compliance action in the compliance policy to 'Send email to end user' and set the schedule to 3 days, then pair with a Conditional Access policy requiring compliant devices", "C": "Create a device filter excluding non-compliant devices from M365 app assignments", "D": "Use Microsoft Defender for Endpoint to quarantine non-compliant devices after 3 days"}, "answer": ["B"], "explanation": "Non-compliance actions with a grace period (3 days) notify users, and a Conditional Access policy requiring device compliance enforces access restriction once the grace period expires.", "skill": "Implement identity and compliance"}, {"id": "1-17", "exam": 1, "n": 17, "domain": "Manage and maintain devices", "question": "You manage devices using Intune and need to deploy a PowerShell script to all Windows 11 devices. The script requires administrative privileges and must run silently without user interaction. Which setting must you configure when adding the script in Intune?", "options": {"A": "Set 'Run this script using the logged on credentials' to No, and 'Run script in 64-bit PowerShell host' to Yes", "B": "Set 'Run this script using the logged on credentials' to Yes", "C": "Configure the script to run as a scheduled task via a Configuration Profile", "D": "Deploy the script as a Win32 app with system context"}, "answer": ["A"], "explanation": "To run PowerShell scripts with admin rights silently, 'Run using logged on credentials' must be set to No (runs as SYSTEM), and 64-bit host ensures full system compatibility.", "skill": "Plan and implement device configuration profiles"}, {"id": "1-18", "exam": 1, "n": 18, "domain": "Manage and maintain devices", "question": "A company is using Intune to manage Windows 11 devices. You need to configure a profile that restricts which USB devices can be connected to corporate laptops, allowing only approved devices. Which configuration profile type should you use?", "options": {"A": "Endpoint Security > Attack Surface Reduction policy", "B": "Device Configuration > Settings Catalog > Device Installation restrictions", "C": "Compliance policy with USB detection rule", "D": "App Control for Business (formerly WDAC) policy"}, "answer": ["B"], "explanation": "Device Installation restrictions in the Settings Catalog (mapped from GPO) allow precise control over which USB device classes or specific hardware IDs are permitted.", "skill": "Plan and implement device configuration profiles"}, {"id": "1-19", "exam": 1, "n": 19, "domain": "Manage and secure applications", "question": "You need to deploy a Win32 application using Intune. The application has multiple dependencies and requires a specific detection method. Which tool should you use to package the application before uploading it to Intune?", "options": {"A": "Microsoft Application Virtualization (App-V) Sequencer", "B": "Microsoft Win32 Content Prep Tool (IntuneWinAppUtil.exe)", "C": "PowerShell App Deployment Toolkit (PSADT)", "D": "Configuration Manager Package wizard"}, "answer": ["B"], "explanation": "IntuneWinAppUtil.exe is the required tool to package Win32 apps into the .intunewin format required for uploading and deploying via the Intune Win32 app pipeline.", "skill": "Deploy and update apps"}, {"id": "1-20", "exam": 1, "n": 20, "domain": "Manage and secure applications", "question": "A company wants to ensure that corporate data in Microsoft Outlook on Windows devices cannot be copied to personal applications. The devices are Microsoft Entra joined and managed by Intune. Which solution should you implement?", "options": {"A": "Configure a Windows Information Protection (WIP) policy with managed apps defined", "B": "Apply a Conditional Access policy blocking clipboard access", "C": "Deploy a custom AppLocker policy via Intune", "D": "Enable Microsoft Defender Application Guard for Office"}, "answer": ["A"], "explanation": "Windows Information Protection (WIP) policies in Intune define corporate vs personal app boundaries, preventing data from flowing from corporate-enlightened apps to personal ones.", "skill": "Plan and implement app protection and app configuration policies", "note": "Windows Information Protection is deprecated. Microsoft now points to Purview endpoint DLP and app protection policies, so treat this as background, not a current skill."}, {"id": "1-21", "exam": 1, "n": 21, "domain": "Manage and secure applications", "question": "You need to deploy Microsoft 365 Apps for enterprise to 300 Windows 11 devices using Intune. You want to use the Current Channel for updates. Which app type should you use when adding the application in Intune?", "options": {"A": "Win32 app (.intunewin)", "B": "Microsoft 365 Apps for Windows (built-in Office suite deployment)", "C": "Line-of-business app (.msi)", "D": "Store app (Microsoft Store for Business)"}, "answer": ["B"], "explanation": "The built-in Microsoft 365 Apps deployment type in Intune provides native configuration of update channels, included apps, and architecture without requiring manual packaging.", "skill": "Deploy and update apps"}, {"id": "1-22", "exam": 1, "n": 22, "domain": "Manage and secure applications", "question": "A company uses Intune App Protection Policies (APP) for Windows. A user reports they can open corporate OneDrive files in Word but cannot save them back to OneDrive. The APP is configured with 'Save copies of org data' blocked. What is causing this behavior?", "options": {"A": "The user's account lacks the OneDrive license", "B": "The App Protection Policy is correctly enforcing the 'Save copies of org data' restriction, preventing saves to unapproved locations", "C": "Intune Management Extension is not installed", "D": "Word is not enrolled as a managed app"}, "answer": ["B"], "explanation": "The 'Save copies of org data' restriction in APP intentionally prevents saving corporate documents to locations outside the approved set, which is the designed behavior.", "skill": "Plan and implement app protection and app configuration policies"}, {"id": "1-23", "exam": 1, "n": 23, "domain": "Manage and secure applications", "question": "Your organization wants to allow users to install approved apps from the Microsoft Store on their managed Windows 11 devices, but prevent installation of any unapproved apps. Which solution should you configure?", "options": {"A": "Configure an AppLocker policy that whitelists specific Store apps", "B": "Use the new Microsoft Store integration in Intune to deploy approved apps, combined with a policy disabling Microsoft Store for end-user browsing", "C": "Deploy App Control for Business (formerly WDAC) in audit mode", "D": "Create a software restriction policy via GPO"}, "answer": ["B"], "explanation": "Deploying approved Store apps through Intune and then restricting the Store prevents users from independently installing unapproved apps while maintaining IT-sanctioned deployments.", "skill": "Deploy and update apps"}, {"id": "1-24", "exam": 1, "n": 24, "domain": "Manage and secure applications", "question": "You are configuring a Win32 app in Intune and need to set a requirement rule that the app only installs on devices with at least 8GB of RAM. Which requirement rule type should you configure?", "options": {"A": "Registry requirement rule checking a RAM registry key", "B": "Script requirement rule using a PowerShell script that returns RAM size", "C": "File system requirement rule checking the Windows directory", "D": "System requirement: Minimum RAM setting in the app properties"}, "answer": ["D"], "explanation": "Win32 app requirement rules include 'Physical memory required (MB)', so you set 8192 directly. A script rule works but isn't needed.", "skill": "Deploy and update apps", "note": "Answer corrected. Your original key said B (script rule). Intune has a built-in memory requirement."}, {"id": "1-25", "exam": 1, "n": 25, "domain": "Manage and secure applications", "question": "A user's Windows 11 device has a LOB (line-of-business) app deployed as Required via Intune but the app is not installing. In the Intune admin center, the app shows status 'Not applicable'. What is the most likely cause?", "options": {"A": "The device is not checking into Intune", "B": "The app assignment target group does not include the device or user, or device/user filters are excluding it", "C": "The .intunewin package is corrupted", "D": "The user has uninstalled the Intune Company Portal"}, "answer": ["B"], "explanation": "'Not applicable' in Intune typically means the device or user is not in the targeted assignment group, or an Intune filter is excluding the device from receiving the app.", "skill": "Deploy and update apps"}, {"id": "1-26", "exam": 1, "n": 26, "domain": "Prepare infrastructure for devices", "question": "A company is implementing Microsoft Entra ID Conditional Access. They want to require MFA only when users sign in from outside the corporate network. Which Conditional Access condition should you configure to define the corporate network boundary?", "options": {"A": "Device compliance condition", "B": "Named Locations (Trusted IP ranges) as an exclusion in the location condition", "C": "Sign-in risk condition set to Low", "D": "User risk condition excluding corporate users"}, "answer": ["B"], "explanation": "Named Locations in Conditional Access allow you to define trusted IP ranges. Excluding Named Locations in the policy means MFA is only required for sign-ins originating outside those trusted IPs.", "skill": "Implement identity and compliance"}, {"id": "1-27", "exam": 1, "n": 27, "domain": "Prepare infrastructure for devices", "question": "You are configuring Microsoft Entra join for company-owned Windows 11 devices. After joining, users report they cannot access on-premises file shares. Domain controllers are accessible from the network. What is most likely the issue?", "options": {"A": "Microsoft Entra joined devices cannot access on-premises resources", "B": "Kerberos SSO for Microsoft Entra joined devices requires an on-premises AD environment with Microsoft Entra Connect configured, and the devices may be missing the necessary Kerberos configuration", "C": "The devices need to be re-registered in Microsoft Entra ID", "D": "Users must use Microsoft Entra ID Application Proxy to access all on-premises resources"}, "answer": ["B"], "explanation": "Microsoft Entra joined devices can access on-premises resources using Kerberos if Microsoft Entra Connect is configured and Microsoft Entra ID Kerberos is enabled (or Cloud Kerberos Trust for Windows Hello). Without this, SSO to on-prem shares fails.", "skill": "Add devices to Microsoft Entra ID"}, {"id": "1-28", "exam": 1, "n": 28, "domain": "Prepare infrastructure for devices", "question": "A company wants to implement Windows Hello for Business (WHfB) using the Cloud Kerberos Trust model for their Microsoft Entra ID hybrid joined devices. What is a prerequisite for this deployment?", "options": {"A": "Microsoft Endpoint Manager device compliance policy must be enabled", "B": "Microsoft Entra ID Kerberos server object must be created in on-premises AD, and devices must run Windows 10 21H2 or later", "C": "All domain controllers must run Windows Server 2022", "D": "Devices must be fully Microsoft Entra joined (not hybrid)"}, "answer": ["B"], "explanation": "Cloud Kerberos Trust requires the Microsoft Entra ID Kerberos server object in on-premises AD (created via the AzureADKerberos module) and client support from Windows 10 21H2 / Windows 11.", "skill": "Implement identity and compliance"}, {"id": "1-29", "exam": 1, "n": 29, "domain": "Prepare infrastructure for devices", "question": "You need to configure Conditional Access to allow only compliant, Microsoft Entra joined Windows 11 devices to access Exchange Online. The policy should not affect mobile devices. How should you scope the Conditional Access policy?", "options": {"A": "Target all users, all cloud apps, and set grant control to require compliant device", "B": "Target all users, Exchange Online cloud app, filter devices to Windows platform only, grant control requires compliant device AND Microsoft Entra joined", "C": "Target all users, Exchange Online, and block all device platforms except Windows", "D": "Use an App Protection Policy instead of Conditional Access for Exchange Online"}, "answer": ["B"], "explanation": "Scoping the CA policy to Exchange Online with a device filter for Windows platform, then granting access only to compliant + Microsoft Entra joined devices, precisely meets the requirement without affecting mobile.", "skill": "Implement identity and compliance"}, {"id": "1-30", "exam": 1, "n": 30, "domain": "Prepare infrastructure for devices", "question": "A company wants to enable Self-Service Password Reset (SSPR) for all employees but requires that users register at least two authentication methods before they can use SSPR. Where is this setting configured in Microsoft Entra ID?", "options": {"A": "Conditional Access > SSPR policy", "B": "Microsoft Entra ID > Password reset > Authentication methods, set 'Number of methods required to reset' to 2", "C": "Microsoft Entra ID > Security > MFA settings > SSPR registration", "D": "Microsoft Endpoint Manager > Endpoint Security > Identity Protection"}, "answer": ["B"], "explanation": "The SSPR configuration in Microsoft Entra ID (Password reset blade) controls the number of authentication methods required to reset. Setting it to 2 enforces dual-method registration.", "skill": "Implement identity and compliance"}, {"id": "1-31", "exam": 1, "n": 31, "domain": "Prepare infrastructure for devices", "question": "Your company uses Microsoft Entra Connect for hybrid identity. Users are reporting that password changes made on-premises are not reflecting in Microsoft Entra ID for up to 4 hours. You need to reduce this delay to near real-time. What should you enable?", "options": {"A": "Microsoft Entra ID Seamless SSO", "B": "Password Hash Synchronization (PHS) with the 'immediate sync' option", "C": "Password Writeback in Microsoft Entra Connect", "D": "Microsoft Entra ID Pass-through Authentication (PTA)"}, "answer": ["B"], "explanation": "Password Hash Synchronization with the default 2-minute delta sync cycle pushes password changes near real-time. The 4-hour delay suggests the full sync cycle is running; verifying PHS delta sync and trigger scheduling resolves this.", "skill": "Implement identity and compliance", "note": "Flawed question: password hash sync has no 'immediate sync' option. Delta sync runs about every 2 minutes by default, so B is only the best of the listed choices."}, {"id": "1-32", "exam": 1, "n": 32, "domain": "Prepare infrastructure for devices", "question": "You are managing Privileged Identity Management (PIM) in Microsoft Entra ID. You need to ensure that when an administrator activates the Global Administrator role, they must provide a justification and be approved by another administrator. Which PIM setting controls this?", "options": {"A": "Role assignment: Set assignment type to Active", "B": "Role settings: Enable 'Require approval to activate' and 'Require justification on activation'", "C": "Conditional Access: Require MFA for admin roles", "D": "Microsoft Entra ID roles > Properties: Enable PIM enforcement"}, "answer": ["B"], "explanation": "PIM role settings allow you to configure activation requirements including approval workflows and mandatory justification text before elevation is granted.", "skill": "Implement identity and compliance"}, {"id": "1-33", "exam": 1, "n": 33, "domain": "Prepare infrastructure for devices", "question": "A company needs to ensure that external guest users in their Microsoft Entra ID tenant can only access specific SharePoint sites and cannot enumerate other users in the directory. Which feature should you configure to limit guest user permissions?", "options": {"A": "Microsoft Entra ID B2B Collaboration settings, setting guest user access to 'Guest users have limited access to properties and memberships of directory objects'", "B": "Conditional Access policy blocking guest users from all apps", "C": "Microsoft Entra ID Identity Protection user risk policy for guest accounts", "D": "Microsoft Defender for Cloud Apps session policy for guests"}, "answer": ["A"], "explanation": "Microsoft Entra ID External Collaboration settings allow restricting guest user permissions so they cannot enumerate directory users/groups, limiting their directory visibility while retaining app access.", "skill": "Implement identity and compliance"}, {"id": "1-34", "exam": 1, "n": 34, "domain": "Protect devices", "question": "You are configuring Microsoft Defender for Endpoint on Windows 11 devices managed by Intune. You need to enable Tamper Protection to prevent users and malware from disabling security features. Where should you configure this in Intune?", "options": {"A": "Device Configuration > Endpoint Protection template", "B": "Endpoint Security > Antivirus > Microsoft Defender Antivirus policy with Tamper Protection set to Enabled", "C": "Compliance policy with Defender Tamper Protection check", "D": "Device Configuration > Settings Catalog > Windows Defender"}, "answer": ["B"], "explanation": "Tamper Protection is configured via Intune Endpoint Security > Antivirus policies. Enabling it via Intune's MEM-managed setting ensures the policy is tenant-wide and cannot be overridden locally.", "skill": "Configure endpoint security", "note": "Verify in the Intune admin center: the Tamper Protection setting lives in Endpoint security > Antivirus > Windows Security experience."}, {"id": "1-35", "exam": 1, "n": 35, "domain": "Protect devices", "question": "A Windows 11 device managed by Intune has an encryption requirement via a compliance policy. The device shows BitLocker is not enabled. You want to silently enable BitLocker without user interaction and save the recovery key to Microsoft Entra ID. Which Intune profile should you configure?", "options": {"A": "A Device Configuration > Endpoint Protection profile with BitLocker settings, requiring silent encryption and configuring recovery key backup to Microsoft Entra ID", "B": "An Endpoint Security > Disk Encryption policy using the FileVault profile", "C": "A Custom OMA-URI policy deploying a BitLocker script", "D": "A Compliance policy with remediation action to enable BitLocker"}, "answer": ["A"], "explanation": "The Endpoint Protection > BitLocker profile in Intune supports silent encryption (no user interaction) and automatic recovery key escrow to Microsoft Entra ID, which satisfies both requirements.", "skill": "Configure endpoint security", "note": "Current path: Endpoint security > Disk encryption (BitLocker policy). The Endpoint Protection template is legacy, and disk encryption policies are named in the skills outline."}, {"id": "1-36", "exam": 1, "n": 36, "domain": "Protect devices", "question": "Your company needs to deploy security patches to managed Windows 11 devices in a staged manner: 10% of devices receive updates first, followed by 90% after a 7-day validation period. Which Intune feature supports this phased update approach?", "options": {"A": "Windows Update compliance policies", "B": "Update Rings for Windows 10 and later, configured with separate rings for pilot and broad groups with a deferral period", "C": "Feature Update policies with a deployment schedule", "D": "Windows Autopatch with automatic deployment groups"}, "answer": ["B"], "explanation": "Intune Update Rings allow you to create separate rings targeting different device groups with staggered quality update deferrals, enabling a pilot-then-broad phased deployment model.", "skill": "Manage device updates"}, {"id": "1-37", "exam": 1, "n": 37, "domain": "Protect devices", "question": "You need to configure Microsoft Defender Firewall rules via Intune for Windows 11 devices. The rules should block all inbound connections except those explicitly allowed. Where in Intune should this be configured?", "options": {"A": "Device Configuration > Settings Catalog > Windows Firewall", "B": "Endpoint Security > Firewall > Windows Firewall policy, with default inbound action set to Block", "C": "Compliance policy with Firewall requirement", "D": "Device Configuration > Endpoint Protection > Windows Defender Firewall (legacy template)"}, "answer": ["B"], "explanation": "Endpoint Security > Firewall policies provide dedicated firewall management including default inbound/outbound actions. Setting default inbound to Block enforces a deny-all-except-allowed posture.", "skill": "Configure endpoint security"}, {"id": "1-38", "exam": 1, "n": 38, "domain": "Protect devices", "question": "A company wants to use Microsoft Defender for Endpoint's attack surface reduction (ASR) rules to block Office applications from creating child processes. They manage devices with Intune. Where should you configure this?", "options": {"A": "Endpoint Security > Antivirus > Defender Antivirus settings", "B": "Endpoint Security > Attack Surface Reduction > Attack Surface Reduction Rules policy", "C": "Device Configuration > Endpoint Protection > Microsoft Defender Exploit Guard", "D": "Microsoft Defender for Endpoint portal > Configuration management > ASR policies"}, "answer": ["B"], "explanation": "ASR rules are configured under Endpoint Security > Attack Surface Reduction in Intune. The rule 'Block Office applications from creating child processes' is directly available here.", "skill": "Configure endpoint security"}, {"id": "1-39", "exam": 1, "n": 39, "domain": "Protect devices", "question": "Your Windows 11 devices are managed by Intune. You need to configure a Windows Update for Business policy that prevents devices from installing updates during business hours (8 AM to 6 PM). Which Update Ring setting should you configure?", "options": {"A": "Set the 'Pause updates' toggle to block all updates during business hours", "B": "Configure 'Active hours' in the Update Ring to the business hours range so Windows defers restarts but not downloads", "C": "Set the quality update deferral period to 10 days to push updates to weekends", "D": "Create a maintenance window in Intune to restrict installation times"}, "answer": ["B"], "explanation": "Active hours in Intune Update Rings define when Windows will NOT perform automatic restarts for updates, ensuring devices aren't disrupted during business operations.", "skill": "Manage device updates"}, {"id": "1-40", "exam": 1, "n": 40, "domain": "Protect devices", "question": "A company wants to ensure that only applications with a valid code signature from a trusted publisher can run on Windows 11 devices. They need a solution that works for Intune-managed devices and does not require an on-premises infrastructure. Which solution should you implement?", "options": {"A": "AppLocker Publisher rules deployed via Intune custom OMA-URI", "B": "App Control for Business (formerly WDAC) policy deployed via Intune, configured in Audit mode first then Enforce mode", "C": "Microsoft Defender SmartScreen configured to block unsigned apps", "D": "Software Restriction Policies via Group Policy deployed through Intune ADMX templates"}, "answer": ["B"], "explanation": "WDAC (formerly Device Guard) is the modern, cloud-friendly application control solution that can be deployed via Intune. Starting in Audit mode allows validation before enforcing publisher trust rules.", "skill": "Configure endpoint security"}, {"id": "1-41", "exam": 1, "n": 41, "domain": "Prepare infrastructure for devices", "question": "You are reviewing the Microsoft Secure Score for your tenant. You notice that 'Ensure MFA is enabled for all privileged users' is showing as incomplete. Which action should you take in Microsoft Entra ID to improve this score?", "options": {"A": "Enable the Legacy MFA per-user settings for admin accounts", "B": "Create a Conditional Access policy targeting all users with admin roles, requiring MFA, and set it to Report- only mode first", "C": "Create a Conditional Access policy requiring MFA for users assigned to any Microsoft Entra ID admin role, set to Enabled", "D": "Enable Security Defaults in Microsoft Entra ID"}, "answer": ["C"], "explanation": "The recommended approach for privileged user MFA is a targeted Conditional Access policy set to Enabled (not Report-only or per-user MFA). Security Defaults also enforces this but is less granular.", "skill": "Implement identity and compliance", "note": "Both answers can be defended. Real-world practice is to run the policy in Report-only first, then switch it to On."}, {"id": "1-42", "exam": 1, "n": 42, "domain": "Protect devices", "question": "Your company is using Microsoft Defender for Endpoint integrated with Intune. A new critical vulnerability is discovered, and you need to identify which managed devices are exposed. Which feature in Defender for Endpoint should you use?", "options": {"A": "Microsoft Secure Score recommendations", "B": "Threat and Vulnerability Management (TVM) > Weaknesses, filtered by the CVE ID", "C": "Intune device compliance report filtered by OS version", "D": "Microsoft Defender portal > Alerts filtered by severity"}, "answer": ["B"], "explanation": "TVM's Weaknesses view in Defender for Endpoint allows you to search by CVE and see all exposed devices, software versions, and remediation recommendations.", "skill": "Configure endpoint security"}, {"id": "1-43", "exam": 1, "n": 43, "domain": "Protect devices", "question": "You are configuring Windows Update for Business using Intune Update Rings. You need to ensure quality updates are deferred by 7 days for most devices, but zero-day patches can be deployed immediately when flagged as critical. Which setting balances this requirement?", "options": {"A": "Set quality update deferral to 0 days and rely on manual approval", "B": "Set quality update deferral to 7 days; use the 'Expedited updates' feature in Intune to override the deferral for emergency patches", "C": "Set quality update deferral to 7 days; create a separate update ring with 0-day deferral for emergency deployments", "D": "Use Windows Autopatch with a dedicated Emergency ring and set standard ring to 7-day deferral"}, "answer": ["B"], "explanation": "Intune's Expedited Windows quality updates feature allows pushing critical patches immediately to targeted devices, overriding existing deferral settings without changing the ring configuration.", "skill": "Manage device updates"}, {"id": "1-44", "exam": 1, "n": 44, "domain": "Manage and maintain devices", "question": "You manage Windows 11 devices with Intune. An Endpoint Security baseline is applied to all devices. A security auditor requests that you verify the current effective security configuration on a specific device. Which Intune feature gives you a per-device view of policy conflicts and effective settings?", "options": {"A": "Intune > Devices > Device compliance report", "B": "Intune > Devices > [Device] > Device configuration, showing profile assignment status and per-setting values including conflict indicators", "C": "Microsoft Entra ID > Sign-in logs for the device", "D": "Microsoft Endpoint Configuration Manager > Device Management > Deployed Policies"}, "answer": ["B"], "explanation": "The device configuration blade in Intune shows each assigned profile, its status, and per-setting reporting including conflicts when multiple policies set the same value differently.", "skill": "Plan and implement device configuration profiles"}, {"id": "1-45", "exam": 1, "n": 45, "domain": "Protect devices", "question": "Your company needs to configure Microsoft Defender for Endpoint's network protection feature to block known malicious IP addresses and domains on Windows 11 devices managed by Intune. Which setting must be enabled for network protection to be in block mode?", "options": {"A": "Set Network Protection to 'Audit Mode' first and then 'Enable' after validation", "B": "Configure Network Protection mode to 'Block' via Endpoint Security > Attack Surface Reduction policy, ensuring Microsoft Defender Antivirus real-time protection is also enabled", "C": "Enable Windows Defender Firewall outbound blocking rules for known IPs", "D": "Configure DNS over HTTPS (DoH) to block malicious domains"}, "answer": ["B"], "explanation": "Network Protection requires real-time protection to be enabled and must be explicitly set to Block mode (not Audit). This is configured via ASR policies or Endpoint Protection in Intune.", "skill": "Configure endpoint security"}, {"id": "2-1", "exam": 2, "n": 1, "domain": "Manage and maintain devices", "question": "A manufacturing company needs to deploy Windows 11 to kiosk devices that run a single application. The devices must not display a Windows desktop or taskbar. Which Windows edition and feature combination should you use?", "options": {"A": "Windows 11 Pro with Assigned Access (Single-App Kiosk) configured via Intune", "B": "Windows 11 Home with Shell Launcher", "C": "Windows 11 Enterprise with AppLocker whitelist", "D": "Windows 11 Pro with Multi-App Kiosk mode"}, "answer": ["A"], "explanation": "Assigned Access in Windows 11 Pro/Enterprise can lock a device to a single UWP or kiosk browser app, hiding the full shell. It is configurable via Intune device configuration profiles.", "skill": "Plan and implement device configuration profiles"}, {"id": "2-2", "exam": 2, "n": 2, "domain": "Manage and maintain devices", "question": "You need to migrate 300 devices from Windows 10 to Windows 11 using Windows Autopilot. Some devices do not meet the Windows 11 hardware requirements. What should you do first before proceeding with the migration?", "options": {"A": "Upgrade the hardware on all devices to meet requirements", "B": "Run the PC Health Check tool or the hardware readiness assessment script to identify ineligible devices, then exclude them from the Windows 11 Autopilot profile", "C": "Set the Feature Update policy target to Windows 11 and let Intune automatically skip ineligible devices", "D": "Re-image all devices with Windows 10 first before upgrading to Windows 11"}, "answer": ["B"], "explanation": "Before deploying Windows 11 via Autopilot, you must identify devices that don't meet hardware requirements (TPM 2.0, Secure Boot, CPU compatibility). The hardware readiness script or PC Health Check performs this assessment.", "skill": "Deploy and upgrade Windows clients"}, {"id": "2-3", "exam": 2, "n": 3, "domain": "Manage and maintain devices", "question": "A company wants to pre-provision Windows Autopilot devices before shipping them to remote employees. Technicians at a staging facility will prepare the devices. Which Autopilot mode supports pre-provisioning by IT before delivery to end users?", "options": {"A": "Self-Deploying mode with Enrollment Status Page", "B": "User-Driven mode with Microsoft Entra join", "C": "Pre-provisioned deployment (formerly White Glove) with Technician Flow", "D": "Microsoft Entra hybrid join with Intune Connector"}, "answer": ["C"], "explanation": "Pre-provisioned deployment (White Glove) has a technician flow that pre-installs apps and policies before the device reaches the end user, who then completes a shorter user flow during first login.", "skill": "Deploy and upgrade Windows clients"}, {"id": "2-4", "exam": 2, "n": 4, "domain": "Manage and maintain devices", "question": "You are managing Windows deployments using SCCM (Configuration Manager). You need to deploy Windows 11 to devices via PXE boot. PXE-enabled distribution points are configured. Users report that PXE boot is not working for newer UEFI devices. What is the most likely configuration issue?", "options": {"A": "UEFI devices require a different WIM file format", "B": "The boot image is not configured to support 64-bit UEFI with the correct network adapter drivers injected, and HTTPS-only mode may be blocking TFTP", "C": "SCCM site server needs the Windows ADK reinstalled", "D": "PXE password is not set in SCCM"}, "answer": ["B"], "explanation": "UEFI PXE boot failures often relate to missing 64-bit UEFI boot images, missing NIC drivers in the boot image, or HTTPS enforcement blocking the TFTP download needed by UEFI firmware.", "skill": "Deploy and upgrade Windows clients"}, {"id": "2-5", "exam": 2, "n": 5, "domain": "Manage and maintain devices", "question": "You are creating a Windows Autopilot deployment profile in Intune for devices that will be used as shared lab computers. Multiple users will log in throughout the day. Which Microsoft Entra ID join type should you configure?", "options": {"A": "Microsoft Entra ID Registered (Workplace join)", "B": "Microsoft Entra hybrid joined", "C": "Microsoft Entra joined with device-based login enabled", "D": "Microsoft Entra joined configured in User-Driven mode; consider enabling shared PC mode via a device configuration profile"}, "answer": ["D"], "explanation": "Microsoft Entra joined devices can be configured with Shared PC mode via Intune, which manages multi-user scenarios by deleting cached profiles and managing disk space for lab/shared environments.", "skill": "Deploy and upgrade Windows clients"}, {"id": "2-6", "exam": 2, "n": 6, "domain": "Manage and maintain devices", "question": "You need to customize the Enrollment Status Page (ESP) in Windows Autopilot. You want the device setup phase to install specific Win32 apps before the user can access the desktop. What must you configure to track these apps in the ESP device phase?", "options": {"A": "Mark the Win32 apps as Required for the All Devices group", "B": "Configure the ESP profile to track selected apps, and ensure the apps are assigned as Required to the device; Win32 apps must also be flagged to appear in ESP", "C": "Set the app assignment intent to Available instead of Required", "D": "Deploy apps via PowerShell scripts instead of Win32 app assignments"}, "answer": ["B"], "explanation": "The ESP device phase tracks specific apps if they are configured in the ESP profile. Win32 apps must be assigned as Required to devices and selected within the ESP profile's app tracking list.", "skill": "Deploy and upgrade Windows clients"}, {"id": "2-7", "exam": 2, "n": 7, "domain": "Manage and maintain devices", "question": "An organization wants to perform a wipe-and-reload of Intune-managed Windows 11 devices when they are reassigned to new users, while retaining the device's Autopilot registration. Which action should you use from Intune?", "options": {"A": "Factory Reset (Wipe with 'Remove enrollment state and user association' option checked)", "B": "Fresh Start", "C": "Autopilot Reset", "D": "Retire the device and re-register it manually"}, "answer": ["C"], "explanation": "Autopilot Reset re-provisions a device back to a business-ready state while keeping the Autopilot registration and Microsoft Entra ID join intact — ideal for device reassignment without full re-registration.", "skill": "Perform remote actions on devices"}, {"id": "2-8", "exam": 2, "n": 8, "domain": "Manage and maintain devices", "question": "Your deployment team is using the Microsoft Deployment Toolkit (MDT). You need to ensure that 32-bit BIOS legacy devices and 64-bit UEFI devices both receive the correct boot image and task sequence automatically. Which MDT mechanism should you configure?", "options": {"A": "Create separate deployment shares for BIOS and UEFI devices", "B": "Use a task sequence variable %IsUEFI% combined with conditional steps or a separate task sequence group per firmware type", "C": "Configure WDS to serve different images based on MAC address", "D": "Modify the boot.wim file to support both firmware types simultaneously"}, "answer": ["B"], "explanation": "MDT exposes the IsUEFI variable during deployment which evaluates to TRUE on UEFI systems. Task sequence conditions using this variable allow branching logic to apply firmware-specific steps.", "skill": "Deploy and upgrade Windows clients"}, {"id": "2-9", "exam": 2, "n": 9, "domain": "Optimize endpoint operations by using automation, monitoring, and reporting", "question": "A company has Windows 11 devices that are co-managed by both Configuration Manager and Intune. An administrator needs to run a remediation script on a co-managed device from Intune but the script is not executing. What is a likely reason?", "options": {"A": "Remediation scripts are not supported on co-managed devices", "B": "The Device configuration workload is still managed by Configuration Manager, so Intune cannot push scripts; the Compliance or Device Configuration workload slider must be moved to Intune", "C": "The Intune Management Extension (IME) is not installed on co-managed devices", "D": "Remediation scripts require Microsoft Endpoint Analytics to be licensed"}, "answer": ["B"], "explanation": "On co-managed devices, script execution from Intune requires the appropriate workload to be switched to Intune. If Configuration Manager controls device configuration, Intune scripts may not execute.", "skill": "Monitor and optimize health"}, {"id": "2-10", "exam": 2, "n": 10, "domain": "Manage and maintain devices", "question": "You are managing 2,000 Windows 11 devices. You need to enforce a policy that disables Bluetooth on all corporate-owned devices but allows it on BYOD devices. How should you configure this in Intune?", "options": {"A": "Create a Bluetooth device configuration profile assigned to All Devices, then add BYOD devices to an exclusion group", "B": "Create a Bluetooth restriction policy, assign it to a dynamic device group where the device is corporate- owned (using enrollment profile name or device ownership filter)", "C": "Create a Compliance policy that flags Bluetooth-enabled devices as non-compliant", "D": "Use a PowerShell script to disable Bluetooth and deploy it to All Devices"}, "answer": ["B"], "explanation": "Targeting a device configuration policy using dynamic groups based on ownership (corporateOwned filter or device category) ensures the Bluetooth restriction applies only to corporate devices.", "skill": "Plan and implement device configuration profiles"}, {"id": "2-11", "exam": 2, "n": 11, "domain": "Prepare infrastructure for devices", "question": "An Intune device compliance policy requires that Windows 11 devices have a minimum OS version of 10.0.22621.0. A device running 10.0.22000.2001 is marked non-compliant. What action does Intune take by default if no non-compliance actions are configured?", "options": {"A": "The device is immediately wiped", "B": "The device is marked non-compliant in Intune; no automatic enforcement action occurs unless paired with a Conditional Access policy or configured non-compliance actions", "C": "Intune automatically upgrades the OS to the minimum required version", "D": "The device is removed from all assignment groups"}, "answer": ["B"], "explanation": "Without configured non-compliance actions or a linked Conditional Access policy, marking non-compliant only changes the device state in Intune. No enforcement (block, wipe, email) happens automatically.", "skill": "Implement identity and compliance"}, {"id": "2-12", "exam": 2, "n": 12, "domain": "Optimize endpoint operations by using automation, monitoring, and reporting", "question": "You need to configure Endpoint Analytics in Microsoft Intune to measure startup performance for Windows 11 devices. Which requirement must be met for devices to report Endpoint Analytics data?", "options": {"A": "Devices must be enrolled via Windows Autopilot", "B": "Devices must be Intune-managed or co-managed with the Intune data collection policy enabled, running a supported OS version", "C": "Devices must have Microsoft Defender for Endpoint sensor enabled", "D": "Devices must be on Windows 11 only; Windows 10 is not supported"}, "answer": ["B"], "explanation": "Endpoint Analytics collects telemetry from Intune-managed or co-managed devices (Windows 10/11) when the Intune data collection policy is assigned. Autopilot is not a requirement.", "skill": "Monitor and optimize health"}, {"id": "2-13", "exam": 2, "n": 13, "domain": "Manage and maintain devices", "question": "A company wants to use Intune's Filters feature to apply a device configuration profile only to Windows 11 devices with a specific device manufacturer. Which filter rule syntax is correct?", "options": {"A": "(device.manufacturer -eq \"Dell\") and (device.osVersion -startsWith \"11\")", "B": "(device.manufacturer -eq \"Dell\") and (device.operatingSystemVersion -startsWith \"10.0.22\")", "C": "device.make = 'Dell' and device.OS = 'Windows 11'", "D": "(device.deviceModel -contains \"Dell\") and (device.osVersion -ge \"10.0.22000\")"}, "answer": ["B"], "explanation": "Intune Filter rules use specific property names: device.manufacturer for make, device.operatingSystemVersion for OS version, with correct operators like -eq and -startsWith.", "skill": "Plan and implement device configuration profiles", "note": "Verify syntax: Intune filter rules use device.osVersion, not device.operatingSystemVersion. B is the closest of the options."}, {"id": "2-14", "exam": 2, "n": 14, "domain": "Manage and maintain devices", "question": "You need to audit which Intune configuration profiles have been assigned to a specific Windows 11 device and verify the deployment status of each policy. Which report in Intune should you use?", "options": {"A": "Intune > Reports > Device Compliance organizational report", "B": "Intune > Devices > [Select device] > Device Configuration, which shows all assigned profiles and their per- profile status", "C": "Microsoft Entra ID > Devices > [Device] > Configuration policies", "D": "Intune > Monitor > Assignment failures report"}, "answer": ["B"], "explanation": "The per-device Device Configuration blade in Intune lists all assigned configuration profiles and their deployment status (Success, Pending, Error, Conflict) for that specific device.", "skill": "Plan and implement device configuration profiles"}, {"id": "2-15", "exam": 2, "n": 15, "domain": "Manage and maintain devices", "question": "A company is using Intune to manage Windows 11 devices. An administrator needs to rename 50 devices in bulk to follow a naming convention (e.g., CORP-DEPT-####). Which approach should you use?", "options": {"A": "Use the 'Rename Device' action for each device individually in the Intune portal", "B": "Export a device list, modify names in CSV, and use Microsoft Graph API or a script to bulk rename via the Intune renameDevice action", "C": "Configure an Autopilot profile with the device name template applied during next Autopilot reset", "D": "Use the Intune Bulk Device Actions > Rename with a CSV file"}, "answer": ["B"], "explanation": "Intune has no CSV bulk-rename action. For many devices, call the Graph renameDevice action (or a PowerShell loop) with your naming convention.", "skill": "Perform remote actions on devices", "note": "Answer changed from C (Autopilot name template). A template applies to new Autopilot deployments, not existing devices. Verify on Learn."}, {"id": "2-16", "exam": 2, "n": 16, "domain": "Manage and maintain devices", "question": "You are troubleshooting an Intune policy that is not applying to a device. The device is in the target group, but the policy shows 'Conflict' status. What does a Conflict status mean, and what should you do?", "options": {"A": "The policy has a syntax error; re-create the profile", "B": "Two or more Intune policies are configuring the same setting with different values; review all overlapping profiles and resolve the conflicting settings", "C": "The device is offline; wait for it to reconnect", "D": "The policy is blocked by a Conditional Access policy"}, "answer": ["B"], "explanation": "A Conflict status in Intune means multiple profiles are applying competing values for the same setting. Identify the conflicting profiles via the device configuration blade and consolidate the settings.", "skill": "Plan and implement device configuration profiles"}, {"id": "2-17", "exam": 2, "n": 17, "domain": "Manage and maintain devices", "question": "You need to configure a device category in Intune that is automatically applied when users enroll their devices. Based on the category, devices will be added to the appropriate Microsoft Entra ID group. What is the correct configuration flow?", "options": {"A": "Configure device categories in Intune, assign them to groups manually after enrollment", "B": "Create device categories in Intune; users select their category during Company Portal enrollment; dynamic Microsoft Entra ID groups with deviceCategory rule auto-assign devices", "C": "Use Autopilot Group Tags to assign device categories automatically", "D": "Configure Microsoft Entra ID group rules based on the device's operating system version"}, "answer": ["B"], "explanation": "Device Categories in Intune prompt users during enrollment to select their category. Dynamic Microsoft Entra ID groups using the deviceCategory property rule automatically assign devices to the correct groups.", "skill": "Plan and implement device configuration profiles"}, {"id": "2-18", "exam": 2, "n": 18, "domain": "Manage and secure applications", "question": "A company is using Microsoft Intune to deploy a Win32 application. The application's detection method uses a registry key. The app appears to install successfully, but Intune continues to show the installation as 'In Progress'. What is most likely the cause?", "options": {"A": "The .intunewin file is too large", "B": "The registry detection rule path or value name does not match what the application actually creates after installation; the detection returns no match", "C": "Intune Management Extension is not running on the device", "D": "The app requires a reboot and will show In Progress until rebooted"}, "answer": ["B"], "explanation": "If the detection rule does not find the expected registry key/value after install, Intune will repeatedly attempt installation. Verify the exact registry path and value name the app creates.", "skill": "Deploy and update apps"}, {"id": "2-19", "exam": 2, "n": 19, "domain": "Manage and secure applications", "question": "You are deploying Microsoft Teams as a Win32 app to Windows 11 devices via Intune. Teams requires the .NET runtime as a dependency. Which Intune Win32 app feature should you configure to ensure .NET installs before Teams?", "options": {"A": "Create a Supersedence relationship between .NET and Teams", "B": "Configure .NET as a dependency in the Teams Win32 app configuration in Intune", "C": "Deploy .NET as a separate Required app and hope it installs first", "D": "Include .NET in the Teams installer package"}, "answer": ["B"], "explanation": "Win32 app Dependencies in Intune ensure prerequisite apps are installed before the dependent app. Configuring .NET as a dependency for the Teams app guarantees install order.", "skill": "Deploy and update apps"}, {"id": "2-20", "exam": 2, "n": 20, "domain": "Manage and secure applications", "question": "A company wants to replace an older version of a deployed Win32 application with a newer version using Intune. The old version must be uninstalled before the new one installs. Which Intune Win32 app feature should you configure?", "options": {"A": "Deploy the new version as a separate app with a new assignment", "B": "Configure a Supersedence relationship in the new app pointing to the old app with 'Uninstall previous version' enabled", "C": "Use a PowerShell pre-install script to remove the old version", "D": "Delete the old app deployment and create a new assignment for the updated app"}, "answer": ["B"], "explanation": "Win32 app Supersedence allows the new version to automatically uninstall the old version before installing the update, maintaining clean app lifecycle management.", "skill": "Deploy and update apps"}, {"id": "2-21", "exam": 2, "n": 21, "domain": "Manage and secure applications", "question": "Your company's security policy requires that users cannot save files from managed apps to personal cloud storage (e.g., personal OneDrive, Dropbox) on their Windows devices. Devices are managed by Intune. Which policy type enforces this restriction?", "options": {"A": "Windows Information Protection (WIP) policy that defines corporate apps and blocks data transfer to personal locations", "B": "Conditional Access policy blocking access to consumer cloud services", "C": "Compliance policy with a custom OMA-URI restricting OneDrive personal", "D": "Intune device restriction profile disabling cloud sync"}, "answer": ["A"], "explanation": "Windows Information Protection policies classify apps as work or personal and can block corporate data from being saved to personal storage locations including personal OneDrive and Dropbox.", "skill": "Plan and implement app protection and app configuration policies", "note": "Windows Information Protection is deprecated. Microsoft now points to Purview endpoint DLP and app protection policies, so treat this as background, not a current skill."}, {"id": "2-22", "exam": 2, "n": 22, "domain": "Manage and secure applications", "question": "You need to deploy a web app (URL shortcut) to Windows 11 devices via Intune so it appears in the Start menu. Which app type in Intune should you use?", "options": {"A": "Win32 app (package a .lnk file using IntuneWinAppUtil)", "B": "Web link app type in Intune (Add app > Web link), and pin it via a Device Configuration profile's Start menu settings", "C": "Microsoft Store app pointing to Edge", "D": "PowerShell script to create the shortcut"}, "answer": ["B"], "explanation": "Intune supports Web link as an app type, which creates a shortcut. Combined with Start menu configuration profiles, it can be pinned for users without packaging.", "skill": "Deploy and update apps"}, {"id": "2-23", "exam": 2, "n": 23, "domain": "Manage and secure applications", "question": "An Intune-managed Windows 11 device shows a Win32 app installation error code 0x80070005 (Access Denied). The app requires administrative rights to install. What is the most likely configuration issue?", "options": {"A": "The .intunewin file permissions are set incorrectly", "B": "The app install context is set to 'User' instead of 'System'; switching to System context grants administrative rights", "C": "The device compliance policy is blocking the installation", "D": "The Intune Management Extension service account lacks permissions"}, "answer": ["B"], "explanation": "Error 0x80070005 (Access Denied) during Intune Win32 app install typically indicates the app is running in User context without admin rights. Changing install context to System resolves this.", "skill": "Deploy and update apps"}, {"id": "2-24", "exam": 2, "n": 24, "domain": "Manage and secure applications", "question": "A company wants to use Intune to prevent users from copying data from managed Microsoft 365 apps to non-managed apps on their Windows 11 devices without enrolling in full MDM. Which feature supports app- level data protection without full device enrollment?", "options": {"A": "Windows Information Protection with enrollment required", "B": "Intune App Protection Policies (MAM without enrollment) for Microsoft 365 apps on Windows", "C": "Conditional Access with app-enforced restrictions", "D": "Microsoft Entra ID B2C application policies"}, "answer": ["B"], "explanation": "Intune MAM (App Protection Policies) for Windows allows data protection controls on Microsoft 365 apps without requiring full MDM device enrollment, protecting data at the app level.", "skill": "Plan and implement app protection and app configuration policies", "note": "App protection for Windows currently covers Microsoft Edge only. Verify current scope on Learn before relying on this."}, {"id": "2-25", "exam": 2, "n": 25, "domain": "Prepare infrastructure for devices", "question": "Your company is deploying Windows Hello for Business using the Key Trust model for Microsoft Entra hybrid joined devices. A user reports they cannot enroll in WHfB during setup. The error indicates the domain controller is not reachable. What is the most likely cause?", "options": {"A": "The user's account doesn't have a Windows Hello license", "B": "For Key Trust WHfB on Microsoft Entra hybrid joined devices, the device must have direct line-of-sight to a Windows Server 2016+ domain controller during initial WHfB provisioning", "C": "Microsoft Entra Connect needs to be upgraded", "D": "The device is not running Windows 11"}, "answer": ["B"], "explanation": "Windows Hello for Business Key Trust (hybrid) requires the device to contact a Windows Server 2016 or newer DC during initial key provisioning to write the NGC key to the user object.", "skill": "Implement identity and compliance"}, {"id": "2-26", "exam": 2, "n": 26, "domain": "Prepare infrastructure for devices", "question": "You are configuring Identity Protection policies in Microsoft Entra ID to automatically block sign-ins with a high sign- in risk level. Which Microsoft Entra ID feature should you use?", "options": {"A": "Microsoft Entra ID MFA settings > Fraud alert", "B": "Microsoft Entra ID Identity Protection > Sign-in risk policy, set to High risk level with Block access", "C": "Conditional Access > Sign-in frequency", "D": "Microsoft Entra ID > Security > Authentication Methods"}, "answer": ["B"], "explanation": "Microsoft Entra ID Identity Protection sign-in risk policies can automatically block or require MFA for sign-ins assessed as high risk based on machine learning signals.", "skill": "Implement identity and compliance"}, {"id": "2-27", "exam": 2, "n": 27, "domain": "Prepare infrastructure for devices", "question": "A company with 500 users wants to roll out Passwordless authentication using Microsoft Authenticator app. Which authentication method must be enabled in Microsoft Entra ID, and where is it configured?", "options": {"A": "Enable 'Passwordless phone sign-in' under Microsoft Entra ID > Security > Authentication methods > Microsoft Authenticator", "B": "Enable FIDO2 security keys under Legacy MFA settings", "C": "Configure passwordless in Microsoft Entra ID > Users > Authentication methods per user", "D": "Enable Windows Hello for Business in Intune for all devices"}, "answer": ["A"], "explanation": "Passwordless phone sign-in using the Authenticator app is enabled in Microsoft Entra ID > Security > Authentication methods > Microsoft Authenticator, where you enable passwordless for targeted users or all users.", "skill": "Implement identity and compliance"}, {"id": "2-28", "exam": 2, "n": 28, "domain": "Prepare infrastructure for devices", "question": "An administrator needs to configure Microsoft Entra ID Conditional Access to grant access only to compliant devices from specific countries. Users in non-allowed countries must be blocked entirely. Which two conditions should you configure?", "options": {"A": "User risk condition + Device compliance condition", "B": "Location condition (Named Locations by country) set to Include specific countries combined with a Device compliance grant control; users outside allowed countries hit the Block policy", "C": "Sign-in risk + Device platform condition", "D": "Application sensitivity + User group condition"}, "answer": ["B"], "explanation": "Configuring a CA policy with Location condition (included countries) and requiring compliant devices, plus a separate blocking policy for excluded locations, enforces both the geographic and compliance requirements.", "skill": "Implement identity and compliance"}, {"id": "2-29", "exam": 2, "n": 29, "domain": "Prepare infrastructure for devices", "question": "A new employee's account exists in on-premises Active Directory and has been synced to Microsoft Entra ID via Microsoft Entra Connect. The employee cannot sign in to Microsoft Entra ID-connected apps. You verify the account is enabled in AD. What should you check next?", "options": {"A": "Verify the Microsoft Entra Connect synchronization cycle has run and the account is visible in Microsoft Entra ID", "B": "Re-create the user account in Microsoft Entra ID manually", "C": "Reset the user's password in Microsoft Entra ID", "D": "Check if the user is in the Intune enrollment restriction exclusion list"}, "answer": ["A"], "explanation": "Newly created on-premises accounts may not yet be synchronized to Microsoft Entra ID. Verifying the sync cycle (Check with Get-ADSyncScheduler or trigger a delta sync) is the correct first step.", "skill": "Implement identity and compliance"}, {"id": "2-30", "exam": 2, "n": 30, "domain": "Prepare infrastructure for devices", "question": "You need to configure Conditional Access so that users accessing SharePoint Online from unmanaged devices can only view documents (read-only) and cannot download them. Which CA grant option enables this limited access?", "options": {"A": "Require compliant device — users without compliant devices are fully blocked", "B": "Use Session controls with 'Use app enforced restrictions' in Conditional Access, combined with SharePoint's unmanaged device policy set to allow limited access", "C": "Configure Microsoft Entra ID App Proxy with access restrictions", "D": "Apply a DLP policy in Microsoft Purview to block downloads"}, "answer": ["B"], "explanation": "App-enforced restrictions in CA Session controls instruct SharePoint to apply its unmanaged device policy (limited/read-only access), enabling limited access without full block.", "skill": "Implement identity and compliance"}, {"id": "2-31", "exam": 2, "n": 31, "domain": "Prepare infrastructure for devices", "question": "A company uses Microsoft Entra ID B2B collaboration. Guest users from a partner organization are unable to complete MFA when signing in. The partner organization uses a different MFA provider. What should you configure in your Microsoft Entra ID tenant?", "options": {"A": "Disable MFA requirements for all guest users", "B": "Configure Conditional Access to trust the guest's home tenant MFA claims using cross-tenant access settings (Inbound trust for MFA from trusted organization)", "C": "Require guests to use your tenant's MFA and ignore their home tena
