nt's MFA", "D": "Create a break-glass account for all guest users"}, "answer": ["B"], "explanation": "Microsoft Entra ID Cross-Tenant Access Settings allow you to configure inbound trust for MFA and device compliance claims from specific trusted partner tenants, eliminating double-MFA prompts for guests.", "skill": "Implement identity and compliance"}, {"id": "2-32", "exam": 2, "n": 32, "domain": "Prepare infrastructure for devices", "question": "You are configuring Access Reviews in Microsoft Entra ID Entitlement Management. You need to ensure that group membership of a privileged security group is reviewed quarterly by the group owner, and members who are not reviewed are automatically removed. Which Access Review configuration achieves this?", "options": {"A": "Schedule the review quarterly, set reviewer as Group Owner, and enable 'Auto-apply results to resource' with 'Remove access' for users who don't respond", "B": "Schedule a monthly review and require managers to approve all members", "C": "Use PIM role assignment review instead of group access review", "D": "Configure an expiration policy on the group membership instead of reviews"}, "answer": ["A"], "explanation": "Access Reviews with Group Owner as reviewer, quarterly schedule, and auto-apply with remove-access for no response automates the removal of unreviewed members from sensitive groups.", "skill": "Implement identity and compliance"}, {"id": "2-33", "exam": 2, "n": 33, "domain": "Protect devices", "question": "Your organization needs to apply Microsoft security baselines to Windows 11 devices using Intune. The security baseline should use Microsoft's recommended settings without customization initially. Which Intune feature should you use?", "options": {"A": "Create a Device Configuration > Endpoint Protection profile and manually configure all CIS benchmark settings", "B": "Deploy a Security Baseline profile (Windows 11 Security Baseline) via Endpoint Security > Security Baselines in Intune", "C": "Use Group Policy ADMX templates imported into Intune", "D": "Enable Security Defaults in Microsoft Entra ID for all device policies"}, "answer": ["B"], "explanation": "Intune Security Baselines are pre-configured templates aligned with Microsoft's recommended security settings for Windows. They can be deployed in one action under Endpoint Security > Security Baselines.", "skill": "Configure endpoint security"}, {"id": "2-34", "exam": 2, "n": 34, "domain": "Protect devices", "question": "A Windows 11 device managed by Intune is showing BitLocker status as 'Not Protected' even though a BitLocker policy is assigned. The device has TPM 2.0 and Secure Boot. What should you check first?", "options": {"A": "Verify the device is connected to the Internet", "B": "Check if the BitLocker policy has successfully applied by reviewing the device configuration status in Intune, and verify there are no policy conflicts blocking the encryption settings", "C": "Manually enable BitLocker via PowerShell and check if TPM is initialized", "D": "Check if the recovery key has been escrowed to Microsoft Entra ID"}, "answer": ["B"], "explanation": "Policy conflicts or application failures are the most common reason BitLocker remains disabled despite hardware meeting requirements. Checking the Intune device configuration status reveals errors or conflicts.", "skill": "Configure endpoint security"}, {"id": "2-35", "exam": 2, "n": 35, "domain": "Protect devices", "question": "You need to onboard Windows 11 devices to Microsoft Defender for Endpoint using Intune. Which integration must be configured before you can use Intune to manage Defender for Endpoint settings?", "options": {"A": "Enable Defender for Endpoint connector in Intune and establish the service-to-service connection in the Microsoft Defender portal", "B": "Install the Defender for Endpoint sensor manually on each device", "C": "Create a separate Intune enrollment for Defender-managed devices", "D": "Enable Azure Sentinel integration with Intune"}, "answer": ["A"], "explanation": "The Defender for Endpoint connector in the Intune admin center establishes the service-to-service connection, enabling Intune to manage Defender settings and receive compliance signals from MDE.", "skill": "Configure endpoint security"}, {"id": "2-36", "exam": 2, "n": 36, "domain": "Protect devices", "question": "Your company wants to implement Microsoft Defender for Endpoint's Automated Investigation and Response (AIR) feature. You need to ensure that in high-confidence cases, threats are automatically remediated without requiring analyst approval. Which AIR setting should you configure?", "options": {"A": "Set remediation level to 'Semi — require approval for all folders'", "B": "Set the device group automation level to 'Full — remediate threats automatically'", "C": "Enable 'Block at First Sight' in Defender Antivirus", "D": "Configure Live Response to allow automated script execution"}, "answer": ["B"], "explanation": "AIR automation level in Defender for Endpoint device groups can be set to Full automation, which allows automatic remediation of high-confidence threats without manual analyst approval.", "skill": "Configure endpoint security"}, {"id": "2-37", "exam": 2, "n": 37, "domain": "Protect devices", "question": "A company needs to prevent Windows 11 devices from installing feature updates that have not been approved by the IT department. They use Intune for device management. Which update management approach should they implement?", "options": {"A": "Create Update Rings with a quality update deferral of 365 days", "B": "Use Windows Autopatch with the Broad ring set to maximum deferral", "C": "Deploy Feature Update policies in Intune targeting a specific Windows version (e.g., 22H2), pinning devices to that version until explicitly updated", "D": "Configure a compliance policy marking devices on unapproved versions as non-compliant"}, "answer": ["C"], "explanation": "Feature Update policies in Intune allow IT to pin devices to a specific Windows version and release the update to the next version only when explicitly changed, giving complete control over OS version progression.", "skill": "Manage device updates"}, {"id": "2-38", "exam": 2, "n": 38, "domain": "Protect devices", "question": "You are managing Windows 11 devices with Intune and want to configure Controlled Folder Access to protect important directories from ransomware. Where should you configure this in Intune?", "options": {"A": "Endpoint Security > Antivirus > Microsoft Defender Antivirus", "B": "Endpoint Security > Attack Surface Reduction > Attack Surface Reduction Rules", "C": "Device Configuration > Endpoint Protection > Microsoft Defender Exploit Guard > Controlled Folder Access", "D": "Microsoft Defender portal > Threat & Vulnerability Management"}, "answer": ["C"], "explanation": "Controlled Folder Access is configured within the Endpoint Protection profile under Microsoft Defender Exploit Guard in Intune device configuration — not in ASR rules or Antivirus policies.", "skill": "Configure endpoint security", "note": "Controlled folder access is also available in the Endpoint security > Attack surface reduction policy. The Exploit Guard template is the legacy path."}, {"id": "2-39", "exam": 2, "n": 39, "domain": "Protect devices", "question": "Your company's Intune-managed devices need to have Windows Defender Credential Guard enabled to protect NTLM and Kerberos credentials. Which device configuration profile should you use?", "options": {"A": "Endpoint Security > Account Protection policy", "B": "Device Configuration > Endpoint Protection > Device Guard (Windows Defender Credential Guard)", "C": "Device Configuration > Identity Protection > Windows Hello for Business", "D": "Endpoint Security > Security Baseline with Credential Guard option"}, "answer": ["B"], "explanation": "Credential Guard is enabled via the Device Configuration > Endpoint Protection profile under Device Guard settings. It requires UEFI, Secure Boot, and virtualization-based security (VBS) support.", "skill": "Configure endpoint security", "note": "Credential Guard can also be set in Endpoint security > Account protection, the newer path."}, {"id": "2-40", "exam": 2, "n": 40, "domain": "Protect devices", "question": "A company needs a report showing all Windows 11 devices that have NOT installed a specific security update (KB number) within the past 30 days. Which Intune feature provides this information?", "options": {"A": "Device Compliance report filtered by OS version", "B": "Windows Update compliance reports in Intune (or Azure Monitor Workbooks for Update Compliance) showing per-KB installation status", "C": "Intune Endpoint Analytics startup performance report", "D": "Microsoft Defender Vulnerability Management showing missing patches"}, "answer": ["B"], "explanation": "Intune's Windows Update compliance reports (or the Update Compliance solution in Azure Monitor) provide detailed per-device, per-update-KB installation status, including devices missing specific patches.", "skill": "Manage device updates", "note": "Update Compliance has been retired. Use Intune update reports or Windows Autopatch reports now."}, {"id": "2-41", "exam": 2, "n": 41, "domain": "Protect devices", "question": "An administrator needs to quickly isolate a compromised Windows 11 device from the network while preserving the ability to still communicate with Microsoft Defender for Endpoint for investigation. Which Defender for Endpoint action should you use?", "options": {"A": "Wipe the device via Intune to remove malware", "B": "Initiate Device Isolation from the Defender for Endpoint portal, which blocks all network traffic except Defender for Endpoint communication", "C": "Apply a Conditional Access policy blocking the device", "D": "Disable the device object in Microsoft Entra ID"}, "answer": ["B"], "explanation": "Device Isolation in Defender for Endpoint blocks all network connections except those required by the Defender agent, enabling investigators to continue working with the device while containing the breach.", "skill": "Configure endpoint security"}, {"id": "2-42", "exam": 2, "n": 42, "domain": "Protect devices", "question": "A company wants to use Windows Autopatch to manage Windows 11 update deployments automatically. What is a prerequisite for enrolling devices in Windows Autopatch?", "options": {"A": "Devices must be running Windows 11 Enterprise or Education, joined to Microsoft Entra ID or Hybrid Microsoft Entra ID, enrolled in Intune, and the tenant must have Microsoft 365 E3/E5 or equivalent licensing", "B": "Devices must be co-managed with Configuration Manager", "C": "Devices must have Microsoft Defender for Endpoint P2 license", "D": "Devices must be running Windows 11 only (Windows 10 is not supported by Autopatch)"}, "answer": ["A"], "explanation": "Windows Autopatch prerequisites include Microsoft Entra joined or Microsoft Entra hybrid joined, Intune managed, Windows 10/11 Enterprise/Education, and Microsoft 365 E3 or higher licensing.", "skill": "Manage device updates", "note": "Verify Autopatch licensing and edition requirements on Learn. They have been relaxed over time."}, {"id": "2-43", "exam": 2, "n": 43, "domain": "Protect devices", "question": "You need to configure Microsoft Defender for Endpoint to collect advanced hunting data about process creation events on Windows 11 devices. Which Defender for Endpoint feature provides this capability?", "options": {"A": "Threat & Vulnerability Management vulnerability scan", "B": "Advanced Hunting using KQL queries against the DeviceProcessEvents table in the Defender portal", "C": "Endpoint Detection and Response (EDR) alert timeline", "D": "Intune Endpoint Analytics > Proactive Remediations"}, "answer": ["B"], "explanation": "Advanced Hunting in Defender for Endpoint uses Kusto Query Language (KQL) against tables like DeviceProcessEvents to query and analyze endpoint telemetry including process creation events.", "skill": "Configure endpoint security"}, {"id": "2-44", "exam": 2, "n": 44, "domain": "Manage and maintain devices", "question": "Your organization uses Microsoft Intune to manage Windows 11 devices. You need to configure a policy to enable audit logging for user account management events and logon events on all managed devices. Which Intune profile type should you use?", "options": {"A": "Endpoint Security > Account Protection", "B": "Device Configuration > Settings Catalog > Audit Policy (Security > Local Policies > Audit Policy)", "C": "Device Configuration > Administrative Templates (ADMX)", "D": "Custom OMA-URI with ./Vendor/MSFT/Policy/Config/Audit CSP"}, "answer": ["B"], "explanation": "The Settings Catalog in Intune includes Audit Policy settings (equivalent to secpol.msc Local Security Policy) that configure Windows event audit categories including account management and logon events.", "skill": "Plan and implement device configuration profiles"}, {"id": "2-45", "exam": 2, "n": 45, "domain": "Protect devices", "question": "A company wants to use Microsoft Defender for Endpoint's 'Deception' capability (also known as deception-based detection or honey tokens) to detect lateral movement attempts. What is this Defender feature called?", "options": {"A": "Threat Intelligence indicators", "B": "Microsoft Defender for Endpoint Deception (lures/honeypots) available under the Deception rules configuration in the Defender portal", "C": "Advanced Hunting custom detection rules", "D": "Network protection indicators of compromise"}, "answer": ["B"], "explanation": "Defender for Endpoint includes a Deception capability that deploys fake credentials and assets (lures) to detect attackers conducting lateral movement; it is configured via Deception rules in the Defender portal.", "skill": "Configure endpoint security"}, {"id": "3-1", "exam": 3, "n": 1, "domain": "Protect devices", "question": "A company is deploying Windows 11 to branch office devices using Autopilot. The branch offices have limited internet bandwidth. During Autopilot deployment, large app downloads are causing significant congestion. Which feature should you enable to reduce internet bandwidth usage during deployment?", "options": {"A": "Configure Delivery Optimization policy via Intune to use LAN peering (P2P) between local devices, and optionally configure a Connected Cache server", "B": "Reduce the number of apps in the Enrollment Status Page", "C": "Upgrade branch office internet connections", "D": "Use SCCM distribution points instead of Intune for app delivery"}, "answer": ["A"], "explanation": "Delivery Optimization with peer-to-peer (LAN) mode allows branch devices to share content with each other. A Connected Cache server on-premises further reduces upstream bandwidth during deployment.", "skill": "Manage device updates"}, {"id": "3-2", "exam": 3, "n": 2, "domain": "Manage and maintain devices", "question": "You are deploying Windows 11 using a Configuration Manager task sequence. A step in the task sequence that installs drivers is failing with error 0x80070002 (File Not Found). What is the most likely cause?", "options": {"A": "The driver package is too large for the task sequence", "B": "The driver package has not been distributed to the distribution point that the client is using, or the package content is not available", "C": "SCCM client is not installed on the target device", "D": "The task sequence variable _SMSTSMediaType is incorrect"}, "answer": ["B"], "explanation": "Error 0x80070002 during task sequence driver installation usually means the driver package content has not been distributed to or downloaded from the applicable distribution point.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-3", "exam": 3, "n": 3, "domain": "Manage and maintain devices", "question": "A company wants to provide a custom branded OOBE experience during Windows Autopilot deployment, including a company logo and customized setup messages. Where should you configure this?", "options": {"A": "In the Autopilot deployment profile, configure the custom OOBE settings", "B": "In Microsoft Entra ID Company Branding, configure the logo and background; this branding is automatically displayed during Autopilot OOBE sign-in pages", "C": "Create a custom WIM image with the branding injected", "D": "Deploy a Group Policy configuring the OOBE welcome screen"}, "answer": ["B"], "explanation": "Microsoft Entra ID Company Branding controls the sign-in page appearance including logos and backgrounds. During Autopilot OOBE, the Microsoft Entra ID sign-in page inherits this branding automatically.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-4", "exam": 3, "n": 4, "domain": "Manage and maintain devices", "question": "You need to deploy a custom provisioning package using Windows Configuration Designer to configure Wi-Fi settings and certificates on Windows 11 devices before they are enrolled in Intune. Which file format does the provisioning package use?", "options": {"A": ".ppkg (provisioning package)", "B": ".msi installation package", "C": ".xml configuration file", "D": ".wim image file"}, "answer": ["A"], "explanation": "Windows Configuration Designer creates .ppkg (provisioning package) files that can be applied during OOBE or after provisioning to configure Wi-Fi, certificates, account settings, and other configurations.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-5", "exam": 3, "n": 5, "domain": "Manage and maintain devices", "question": "A technician needs to add drivers to a Windows PE boot image used in a Configuration Manager OSD task sequence. The drivers must be available during the WinPE phase. Which SCCM process should the technician follow?", "options": {"A": "Import the drivers into the SCCM driver catalog and add them to a driver package deployed during task sequence", "B": "Import the drivers into the driver catalog, add them to the applicable boot image in SCCM, and update (redistribute) the boot image to distribution points", "C": "Manually inject the drivers into the WIM file using DISM", "D": "Add the driver INF files to the task sequence run command line step"}, "answer": ["B"], "explanation": "Drivers needed during WinPE must be added directly to the boot image in SCCM (not just driver packages), then the boot image must be updated and redistributed so PXE clients receive the updated image.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-6", "exam": 3, "n": 6, "domain": "Manage and maintain devices", "question": "Your organization needs to verify that Windows 11 Autopilot deployments complete successfully, including all required app installations, before users can access the desktop. The deployment must halt if critical apps fail. Which Intune feature should you configure?", "options": {"A": "Intune compliance policy requiring app installation", "B": "Enrollment Status Page (ESP) configured to block user access until required apps are installed, with 'Block device use until all apps and profiles are installed' enabled", "C": "Autopilot deployment profile with 'Block device usage' option", "D": "Conditional Access policy requiring app installation compliance"}, "answer": ["B"], "explanation": "The Enrollment Status Page in Intune can be configured to track app and profile installations and block desktop access until all required components are installed, with error handling to halt if installs fail.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-7", "exam": 3, "n": 7, "domain": "Manage and maintain devices", "question": "A company is using MDT with a Configuration Manager integration (Zero Touch Installation). After deploying Windows 11, the SCCM client installs but does not appear in the SCCM console. The task sequence completed successfully. What should you check?", "options": {"A": "Verify the SCCM site code is correct in the client installation properties and the client communication certificate is valid", "B": "Re-run the Windows 11 deployment task sequence", "C": "Check that the device has internet access", "D": "Verify the Intune Management Extension is installed"}, "answer": ["A"], "explanation": "If the SCCM client installs but the device doesn't appear in the console, the client cannot communicate with the management point. Checking site code, boundaries, boundary groups, and client certificates is the correct first step.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-8", "exam": 3, "n": 8, "domain": "Manage and maintain devices", "question": "You are configuring a Windows Autopilot User-Driven Microsoft Entra hybrid join deployment. After OOBE, users report the device is not appearing in on-premises Active Directory. The Intune Connector for Active Directory is installed. What should you verify?", "options": {"A": "Verify the organizational unit (OU) specified in the Autopilot Domain Join profile exists and the connector computer account has 'Create Computer Objects' permissions on that OU", "B": "Verify Microsoft Entra Connect is synchronizing every 5 minutes", "C": "Check that the Intune Connector is installed on the domain controller itself", "D": "Verify the Autopilot device has a TPM chip"}, "answer": ["A"], "explanation": "Hybrid Microsoft Entra ID join via Autopilot requires the connector service account to have permission to create computer objects in the target OU. If the OU is missing or permissions are insufficient, the domain join fails silently.", "skill": "Deploy and upgrade Windows clients"}, {"id": "3-9", "exam": 3, "n": 9, "domain": "Manage and maintain devices", "question": "A company has deployed an Intune security baseline to Windows 11 devices. Several devices show settings as 'Error' state. Where should you look to identify the specific settings causing errors?", "options": {"A": "Microsoft Entra ID Sign-in logs", "B": "Intune > Devices > [Device] > Device Configuration > the Security Baseline profile, which shows per-setting status with error details", "C": "Windows Event Viewer on the device under Applications and Services Logs > Microsoft > Windows > DeviceManagement-Enterprise-Diagnostics-Provider", "D": "Both B and C provide useful information for troubleshooting"}, "answer": ["D"], "explanation": "Both the Intune per-device configuration blade (showing per-setting status) and the Windows Event Viewer's DeviceManagement diagnostic log provide complementary information for diagnosing policy errors.", "skill": "Plan and implement device configuration profiles"}, {"id": "3-10", "exam": 3, "n": 10, "domain": "Optimize endpoint operations by using automation, monitoring, and reporting", "question": "You need to create an Intune compliance policy that checks whether a specific registry key exists on Windows 11 devices and marks them non-compliant if it is missing. Which compliance policy setting type supports custom checks like registry queries?", "options": {"A": "System Security settings in compliance policy", "B": "Custom compliance policy using a PowerShell discovery script and corresponding JSON rules file", "C": "Custom OMA-URI compliance setting", "D": "Endpoint Analytics proactive remediation"}, "answer": ["B"], "explanation": "Custom compliance in Intune uses a PowerShell discovery script that outputs JSON values, which are then evaluated against JSON rules you define. This enables arbitrary checks like registry key presence.", "skill": "Automate management tasks"}, {"id": "3-11", "exam": 3, "n": 11, "domain": "Manage and maintain devices", "question": "Your company uses Intune to manage Windows 11 devices. You need to configure Microsoft Edge as the default browser and set a specific homepage for all corporate devices. Users should not be able to change these settings. Which configuration method should you use?", "options": {"A": "Deploy a PowerShell script to set Edge registry keys", "B": "Deploy an ADMX-backed Edge policy via Intune Administrative Templates (ADMX profile) locking the homepage and default browser settings", "C": "Configure a Device Restriction profile in Intune for browser settings", "D": "Publish Edge configuration via Microsoft 365 admin center"}, "answer": ["B"], "explanation": "Intune ADMX profiles support the full Edge ADMX template, allowing IT to configure and lock Edge policies (homepage, default browser, extensions, etc.) that users cannot override.", "skill": "Plan and implement device configuration profiles"}, {"id": "3-12", "exam": 3, "n": 12, "domain": "Prepare infrastructure for devices", "question": "A company is piloting Intune management. You need to configure co-management with Configuration Manager for 500 existing SCCM-managed devices. These devices are already Microsoft Entra ID registered. What is the first step to enable co-management?", "options": {"A": "Uninstall the SCCM client and re-enroll devices in Intune", "B": "In Configuration Manager, enable co-management (Cloud Attach) and configure the auto-enrollment policy to enroll devices into Intune via Microsoft Entra ID", "C": "Join all devices to Microsoft Entra ID first, then enable co-management", "D": "Import the device list into Intune manually"}, "answer": ["B"], "explanation": "Co-management is enabled in Configuration Manager via the Cloud Attach configuration. SCCM auto-enrolls existing domain-joined, Microsoft Entra ID registered or hybrid joined clients into Intune without re-imaging.", "skill": "Enroll devices to Microsoft Intune"}, {"id": "3-13", "exam": 3, "n": 13, "domain": "Optimize endpoint operations by using automation, monitoring, and reporting", "question": "You need to configure an Intune Proactive Remediation (now 'Remediations') script package that detects and automatically fixes a misconfigured registry value on Windows 11 devices. What are the two required scripts?", "options": {"A": "A compliance script and an OMA-URI script", "B": "A Detection script (returns exit code 1 if issue found) and a Remediation script (fixes the issue and returns exit code 0 on success)", "C": "A pre-install script and a post-install script", "D": "A PowerShell detection rule and a Win32 app install script"}, "answer": ["B"], "explanation": "Intune Remediations require a Detection script that returns exit code 1 when the issue is detected, and a Remediation script that corrects the issue and exits 0 on success — Intune pairs these together.", "skill": "Monitor and optimize health"}, {"id": "3-14", "exam": 3, "n": 14, "domain": "Manage and maintain devices", "question": "You are managing Windows 11 devices in Intune. A recently deployed Device Configuration profile is applying correctly to most devices, but 12 devices show 'Pending' status for 3 days. What are the most likely reasons?", "options": {"A": "The devices are powered off, disconnected from internet, or have not checked into Intune within the policy refresh interval (default 8 hours + triggers)", "B": "The profile was incorrectly configured for those 12 devices", "C": "Those devices have a different Windows 11 version", "D": "Intune has a service outage affecting those specific devices"}, "answer": ["A"], "explanation": "'Pending' indicates the profile has not been delivered to the device yet — commonly because devices are offline, turned off, or have not performed an MDM check-in. Investigating device connectivity is the first step.", "skill": "Plan and implement device configuration profiles"}, {"id": "3-15", "exam": 3, "n": 15, "domain": "Prepare infrastructure for devices", "question": "A Windows 11 device is enrolled in Intune but shows 'MDM enrollment: Not enrolled' in Settings. The device appears in Intune. What is this condition called, and what may have happened?", "options": {"A": "The device is Microsoft Entra ID Registered but not MDM enrolled; the user may have joined Microsoft Entra ID without going through the MDM enrollment path", "B": "The device is co-managed and showing SCCM as the primary manager", "C": "The Intune license was removed after enrollment", "D": "The device was enrolled in a different tenant"}, "answer": ["A"], "explanation": "Devices can be Microsoft Entra ID Registered (Workplace Joined) without being MDM enrolled. This can happen when joining Microsoft Entra ID through Settings without the auto-enrollment policy directing them to Intune.", "skill": "Enroll devices to Microsoft Intune"}, {"id": "3-16", "exam": 3, "n": 16, "domain": "Prepare infrastructure for devices", "question": "You need to configure Intune to automatically enroll all Microsoft Entra joined Windows 11 devices into MDM without requiring user action. Which setting must be configured in Microsoft Entra ID?", "options": {"A": "Configure auto-enrollment in Microsoft Entra ID > Mobility (MDM and MAM) > Microsoft Intune, setting MDM user scope to 'All' or a specific group", "B": "Enable auto-enrollment in the Intune Enrollment restrictions policy", "C": "Set the MDM authority in Microsoft Entra ID to Intune", "D": "Configure an Autopilot profile with auto-enrollment enabled"}, "answer": ["A"], "explanation": "Microsoft Entra ID > Mobility (MDM and MAM) > Microsoft Intune controls the MDM auto-enrollment scope. Setting it to All or a group triggers automatic MDM enrollment when users Microsoft Entra ID join a device.", "skill": "Enroll devices to Microsoft Intune"}, {"id": "3-17", "exam": 3, "n": 17, "domain": "Manage and secure applications", "question": "A company uses Intune to manage Windows 11 devices. They want to deploy a LOB application that is currently packaged as an .exe installer with silent install switches. Which Intune app type should you use?", "options": {"A": "Line-of-Business app (.msi only)", "B": "Win32 app — package using IntuneWinAppUtil.exe, configure install command with silent switches, and define a detection rule", "C": "Microsoft Store app", "D": "Office add-in deployment through Microsoft 365 Apps"}, "answer": ["B"], "explanation": "Win32 app deployment in Intune supports .exe installers. Package with IntuneWinAppUtil, specify the silent install command, and configure a detection rule to verify successful installation.", "skill": "Deploy and update apps"}, {"id": "3-18", "exam": 3, "n": 18, "domain": "Manage and secure applications", "question": "You are configuring the Microsoft 365 Apps deployment via Intune. You need to ensure that only specific apps (Word, Excel, Outlook) are installed, and that the ProPlus apps (Access, Publisher) are excluded. Where should you configure this?", "options": {"A": "Deploy only the selected apps by configuring the Microsoft 365 Apps configuration in Intune, selecting the specific apps to include under the Suite settings", "B": "Deploy the full Microsoft 365 Apps suite and then use AppLocker to block unwanted apps", "C": "Deploy using an Office Deployment Tool (ODT) config.xml as a Win32 app", "D": "Use Group Policy to hide unused Office app shortcuts"}, "answer": ["A"], "explanation": "The Microsoft 365 Apps (Office suite) deployment in Intune allows you to select exactly which apps to include in the installation via the Configure App Suite settings pane.", "skill": "Deploy and update apps"}, {"id": "3-19", "exam": 3, "n": 19, "domain": "Manage and secure applications", "question": "A company deploys a Win32 app with a 32-bit installer to Windows 11 64-bit devices. The app installs successfully but the detection rule using a registry path under HKLM\\SOFTWARE\\AppName fails. What is likely causing the detection failure?", "options": {"A": "Intune does not support 32-bit app detection on 64-bit systems", "B": "32-bit apps on 64-bit Windows are redirected to HKLM\\SOFTWARE\\WOW6432Node\\AppName. The detection rule must account for registry redirection or run in a 32-bit registry view", "C": "The app requires system context to write to HKLM", "D": "The detection registry key must be under HKCU instead of HKLM"}, "answer": ["B"], "explanation": "On 64-bit Windows, 32-bit apps write registry entries under WOW6432Node. The Intune registry detection rule must target the WOW6432Node path or use the 32-bit registry view option.", "skill": "Deploy and update apps"}, {"id": "3-20", "exam": 3, "n": 20, "domain": "Manage and secure applications", "question": "You need to configure a Windows 10/11 App Protection Policy (MAM) for Microsoft Edge on managed devices to prevent users from browsing personal sites using the corporate Edge profile while in managed mode. Which setting should you configure?", "options": {"A": "Allowed data storage locations: OneDrive for Business only", "B": "Configure an Intune MAM policy for Edge with 'Restrict web content transfer with other apps' to enforce corporate browsing within the managed Edge context", "C": "Deploy a Conditional Access policy for Edge browser", "D": "Configure Edge Enterprise Mode site lists to redirect personal URLs"}, "answer": ["B"], "explanation": "Intune App Protection Policies for Edge include settings that control where web content can be transferred, effectively keeping corporate browsing within the managed Edge session boundary.", "skill": "Plan and implement app protection and app configuration policies"}, {"id": "3-21", "exam": 3, "n": 21, "domain": "Manage and secure applications", "question": "Your company uses Microsoft Purview Information Protection. Sensitivity labels are applied to documents. You need to ensure that documents labeled 'Confidential' cannot be opened on unmanaged Windows devices. Which technology enforces this?", "options": {"A": "Windows Information Protection policy", "B": "Microsoft Purview sensitivity label encryption with Rights Management Services (RMS) protection requiring Microsoft Entra ID authentication, combined with Conditional Access device compliance requirements", "C": "Intune App Protection Policy for Office apps", "D": "Microsoft Entra ID Identity Protection document risk policy"}, "answer": ["B"], "explanation": "Sensitivity labels with RMS encryption enforce access controls at the document level regardless of device. Pairing with CA device compliance requirements blocks unmanaged devices from decrypting Confidential documents.", "skill": "Plan and implement app protection and app configuration policies"}, {"id": "3-22", "exam": 3, "n": 22, "domain": "Manage and secure applications", "question": "A Win32 app deployed via Intune fails to install on 5 devices. You need to view the detailed installation log for a specific device. Where can you find this log locally on the Windows device?", "options": {"A": "C:\\Windows\\System32\\winevt\\Logs\\Application.evtx", "B": "C:\\ProgramData\\Microsoft\\IntuneManagementExtension\\Logs\\IntuneManagementExtension.log", "C": "C:\\Windows\\CCM\\Logs\\AppEnforce.log (Configuration Manager log)", "D": "C:\\Users\\<username>\\AppData\\Local\\Temp\\Intune\\"}, "answer": ["B"], "explanation": "The Intune Management Extension log at C:\\ProgramData\\Microsoft\\IntuneManagementExtension\\Logs\\IntuneManagementExtension.log contains detailed Win32 app installation activity, errors, and detection results.", "skill": "Deploy and update apps"}, {"id": "3-23", "exam": 3, "n": 23, "domain": "Manage and secure applications", "question": "A company needs to deploy an application that is available in the Microsoft Store for Business. Microsoft Store for Business is being retired. What is the recommended replacement for distributing managed Store apps via Intune?", "options": {"A": "Continue using Microsoft Store for Business until your existing licenses expire", "B": "Use the new Microsoft Store integration in Intune (Windows Package Manager / WinGet-based) to search and deploy Store apps directly from Intune without Store for Business", "C": "Download the app MSIX package and deploy as a Win32 app", "D": "Use Microsoft Endpoint Configuration Manager Software Center"}, "answer": ["B"], "explanation": "Microsoft replaced Store for Business with direct Intune integration using the new Microsoft Store connector, allowing IT to search, assign, and deploy Store apps directly from the Intune admin center.", "skill": "Deploy and update apps"}, {"id": "3-24", "exam": 3, "n": 24, "domain": "Prepare infrastructure for devices", "question": "A company has Microsoft Entra Connect configured with Password Hash Synchronization. They want to block authentication at Microsoft Entra ID for users whose on-premises accounts are disabled. Which feature must be enabled in Microsoft Entra Connect?", "options": {"A": "Seamless SSO", "B": "Pass-through Authentication instead of PHS", "C": "Soft match for user accounts", "D": "Synchronize account disabled state by enabling the 'Block sign-in for disabled on-premises users' option, which requires ensuring the accountEnabled attribute is synced"}, "answer": ["D"], "explanation": "With PHS, Microsoft Entra Connect can sync the on-premises account's enabled/disabled state. When a user is disabled in AD, Microsoft Entra Connect syncs the accountEnabled=false state, blocking Microsoft Entra ID sign-in.", "skill": "Implement identity and compliance", "note": "Flawed question: no such Entra Connect option exists. Disabled on-premises accounts sync their disabled state by default."}, {"id": "3-25", "exam": 3, "n": 25, "domain": "Prepare infrastructure for devices", "question": "You need to configure Microsoft Entra ID to require that all administrative actions in the Azure portal are performed from specific named IP ranges only. Which Conditional Access configuration achieves this?", "options": {"A": "Target all admin users and the Microsoft Azure Management app, include all locations, exclude Named Locations (corporate IPs), and set grant to Block", "B": "Set Identity Protection user risk policy to block high-risk admins", "C": "Configure admin accounts to require MFA from all locations", "D": "Use PIM to restrict admin activations to specific IP ranges"}, "answer": ["A"], "explanation": "A CA policy targeting admin users and the Azure Management cloud app, blocking access except from Named (trusted) Locations, ensures admin portal access is restricted to corporate IP ranges only.", "skill": "Implement identity and compliance"}, {"id": "3-26", "exam": 3, "n": 26, "domain": "Prepare infrastructure for devices", "question": "A company wants to implement Microsoft Entra ID Multi-Factor Authentication using Conditional Access but needs to exclude a service account used for automated processes from MFA requirements. What is the recommended approach?", "options": {"A": "Create a separate Conditional Access policy for service accounts that requires MFA", "B": "Add the service account to an exclusion group in the Conditional Access policy, and protect the service account using a strong password and monitoring via Microsoft Entra ID Identity Protection", "C": "Disable MFA entirely for all service accounts", "D": "Register the service account for MFA and configure it to approve automatically"}, "answer": ["B"], "explanation": "Service accounts used for automation cannot respond to MFA prompts. Best practice is to exclude them from CA MFA policies using a group, then compensate with very strong passwords and Identity Protection monitoring.", "skill": "Implement identity and compliance"}, {"id": "3-27", "exam": 3, "n": 27, "domain": "Prepare infrastructure for devices", "question": "Your company is using Microsoft Entra ID Entitlement Management. You need to create an access package that allows users to request membership in a SharePoint site and an Microsoft Entra ID security group, with automatic approval for internal users and manager approval for external guests. Which Entitlement Management feature supports different approval flows for different user types?", "options": {"A": "Access packages support multiple policies within one package, each with different approval settings and targeted at different user scopes (internal vs. external)", "B": "Create separate access packages for internal and external users", "C": "Use PIM to manage SharePoint and group access separately", "D": "Configure SharePoint sharing policies to handle approval differences"}, "answer": ["A"], "explanation": "Entitlement Management access packages support multiple assignment policies targeting different populations (internal users vs. guests), each with independent approval workflows.", "skill": "Implement identity and compliance"}, {"id": "3-28", "exam": 3, "n": 28, "domain": "Prepare infrastructure for devices", "question": "A company's security team wants to review and remediate risky users identified by Microsoft Entra ID Identity Protection. Which action should you take for users flagged as high risk in Identity Protection?", "options": {"A": "Delete and recreate the user accounts to reset their risk state", "B": "Investigate the user risk events in Identity Protection, and if legitimate risk is confirmed, initiate a password reset and dismiss/confirm the risk. Optionally configure a User Risk Policy to force password reset automatically", "C": "Block the users with a Conditional Access policy and wait for them to contact IT", "D": "Disable MFA for high-risk users to allow them to complete the remediation sign-in"}, "answer": ["B"], "explanation": "The correct process is to review the risk detections in Identity Protection, investigate whether they are genuine, and remediate by forcing a secure password reset. Risk policies can automate this for high-risk users.", "skill": "Implement identity and compliance"}, {"id": "3-29", "exam": 3, "n": 29, "domain": "Prepare infrastructure for devices", "question": "Your organization needs to allow users to reset their own passwords from the Windows 11 sign-in screen when they have forgotten their password. Which Microsoft Entra ID and device feature must be enabled?", "options": {"A": "Require Microsoft Entra joined devices and enable SSPR writeback", "B": "Enable SSPR in Microsoft Entra ID for the user group, and enable the 'Show SSPR link on the sign-in screen' policy via Intune (or via Microsoft Entra ID > SSPR > On-premises integration settings for hybrid)", "C": "Configure Windows Hello for Business as the only sign-in option", "D": "Deploy a custom GINA replacement for password reset on the sign-in screen"}, "answer": ["B"], "explanation": "Microsoft Entra ID SSPR must be enabled for users, and the Windows sign-in SSPR option must be enabled via Intune device policy or Microsoft Entra ID hybrid SSPR integration to surface the reset link at the logon screen.", "skill": "Implement identity and compliance"}, {"id": "3-30", "exam": 3, "n": 30, "domain": "Prepare infrastructure for devices", "question": "A company is implementing Zero Trust. You need to ensure that users accessing corporate resources from personal devices can only access them if the sign-in is from a known location and uses an approved client app. Which Conditional Access session control should you use for unmanaged devices?", "options": {"A": "Require compliant device (blocks personal devices)", "B": "Use App-enforced restrictions and Microsoft Defender for Cloud Apps session policies to monitor and control sessions from unmanaged devices while allowing limited access", "C": "Enable Sign-in frequency control to force re-authentication every hour", "D": "Block all personal devices from accessing corporate resources"}, "answer": ["B"], "explanation": "Defender for Cloud Apps session policies via Conditional Access enable conditional session control for unmanaged devices — allowing access with restrictions (download block, session monitoring) rather than full block.", "skill": "Implement identity and compliance"}, {"id": "3-31", "exam": 3, "n": 31, "domain": "Prepare infrastructure for devices", "question": "You are configuring Microsoft Entra Connect cloud sync as a replacement for Microsoft Entra Connect sync. A company has 3 separate on-premises Active Directory forests. What is an advantage of cloud sync over traditional Microsoft Entra Connect for this scenario?", "options": {"A": "Cloud sync supports more attribute mapping options", "B": "Cloud sync uses lightweight provisioning agents installed per forest, supporting multi-forest scenarios without requiring a central Microsoft Entra Connect server with full AD connectivity to all forests", "C": "Cloud sync provides faster synchronization than Microsoft Entra Connect", "D": "Cloud sync supports Exchange hybrid deployment natively while Microsoft Entra Connect does not"}, "answer": ["B"], "explanation": "Microsoft Entra Connect cloud sync deploys lightweight agents per AD domain/forest, making multi-forest scenarios simpler to manage without a single large sync server needing connectivity to all forests.", "skill": "Add devices to Microsoft Entra ID"}, {"id": "3-32", "exam": 3, "n": 32, "domain": "Protect devices", "question": "A company needs to implement disk encryption on Windows 11 devices but some devices are older and use a software-only TPM. BitLocker with TPM 1.2 is not meeting the security standard. Which alternative encryption approach should be evaluated?", "options": {"A": "Enable BitLocker with a USB startup key requirement as additional protector alongside software TPM", "B": "Use BitLocker with TPM 2.0 chip (require hardware replacement for devices with only software TPM or TPM 1.2)", "C": "Deploy third-party encryption software via Intune as a Win32 app", "D": "Configure Encrypted Hard Drive (eDrive) using self-encrypting drives"}, "answer": ["B"], "explanation": "For full security compliance, TPM 2.0 hardware is the recommended minimum. Devices with only TPM 1.2 or software TPM should be hardware-upgraded or replaced, as TPM 1.2 does not meet current security baselines.", "skill": "Configure endpoint security"}, {"id": "3-33", "exam": 3, "n": 33, "domain": "Protect devices", "question": "You are configuring Microsoft Defender for Endpoint to automatically quarantine files matching specific threat intelligence (IOC) hash values from a threat feed. Where should you configure these hash-based indicators?", "options": {"A": "Microsoft Defender Antivirus custom scan exclusions (reversed)", "B": "Microsoft Defender for Endpoint portal > Settings > Endpoints > Indicators, add File hash IOCs with action set to Block and Quarantine", "C": "Intune Endpoint Security > Attack Surface Reduction > File hash blocking rules", "D": "Purview > Data Loss Prevention policies with file hash matching"}, "answer": ["B"], "explanation": "Custom IOC indicators in the Defender for Endpoint portal allow you to add specific file hashes with Block/Quarantine actions, which are then enforced across all onboarded devices.", "skill": "Configure endpoint security"}, {"id": "3-34", "exam": 3, "n": 34, "domain": "Protect devices", "question": "An organization uses Windows Update for Business managed via Intune. They want to ensure that devices on a slow internet connection can download updates from nearby peers on the local network. Which feature enables this?", "options": {"A": "Windows Update caching via the BITS service", "B": "Delivery Optimization configured with Download mode set to LAN (mode 1), allowing peer-to-peer caching on the local network", "C": "WSUS on-premises distribution configured in hybrid mode", "D": "Configure a proxy server to cache Windows Update content"}, "answer": ["B"], "explanation": "Delivery Optimization with Download mode set to LAN (mode 1) enables peer-to-peer sharing of update content between devices on the same local subnet, reducing internet bandwidth consumption.", "skill": "Manage device updates"}, {"id": "3-35", "exam": 3, "n": 35, "domain": "Protect devices", "question": "You need to configure a Microsoft Defender for Endpoint policy that alerts (but does not block) when users attempt to access known malicious URLs on Windows 11 devices managed by Intune. Which setting should you configure?", "options": {"A": "Configure Network Protection in Audit mode via ASR/Endpoint Protection policy in Intune", "B": "Configure SmartScreen in Warn mode for corporate devices", "C": "Set Web Content Filtering to audit mode in Defender for Endpoint", "D": "Configure Conditional Access to log but not block malicious URL access"}, "answer": ["A"], "explanation": "Network Protection in Audit mode logs attempts to access malicious URLs/IPs without blocking, allowing visibility into risky behavior before switching to Block mode after validation.", "skill": "Configure endpoint security"}, {"id": "3-36", "exam": 3, "n": 36, "domain": "Protect devices", "question": "A company is onboarding to Windows Autopatch. After enrollment, the IT team notices that some devices are in the 'Not Ready' state for Autopatch. What are common reasons for this state?", "options": {"A": "Devices are powered off during the initial assessment", "B": "Devices do not meet Autopatch prerequisites such as missing required licenses, not Intune-managed, not Microsoft Entra ID/Hybrid joined, or not running a supported OS version", "C": "Devices have not synchronized with Intune in the last 24 hours", "D": "Devices are in the wrong Microsoft Entra ID group for Autopatch"}, "answer": ["B"], "explanation": "Autopatch's 'Not Ready' status indicates prerequisite failures such as licensing (M365 E3+), Intune enrollment, Microsoft Entra ID join status, or unsupported OS. The Autopatch readiness report details the specific failing prerequisite.", "skill": "Manage device updates"}, {"id": "3-37", "exam": 3, "n": 37, "domain": "Protect devices", "question": "Your Intune-managed Windows 11 devices require that any removable storage (USB drives) is encrypted with BitLocker before it can be written to. Which BitLocker configuration should you enable via Intune?", "options": {"A": "Enable BitLocker on the OS drive only", "B": "Enable BitLocker To Go (removable drive encryption) in the BitLocker policy, requiring encryption before write access is granted to removable storage", "C": "Configure a Device Restriction profile to block all USB write access", "D": "Deploy a DLP policy to detect and block writes to USB"}, "answer": ["B"], "explanation": "BitLocker To Go is the BitLocker feature for removable drives. Configuring 'Deny write access to removable drives not protected by BitLocker' enforces encryption before any data can be written to USB drives.", "skill": "Configure endpoint security"}, {"id": "3-38", "exam": 3, "n": 38, "domain": "Protect devices", "question": "You need to deploy a Microsoft Defender for Endpoint security configuration policy to manage ASR rules for devices that are not Intune-enrolled but are onboarded to Defender for Endpoint. Which Defender feature enables this management capability?", "options": {"A": "Group Policy with ADMX templates from the Defender portal", "B": "Defender for Endpoint Security Configuration Management (MEM attach / 'Manage security settings in Defender'), which allows Intune security policies to target MDE-onboarded devices without full Intune enrollment", "C": "SCCM compliance baseline with Defender integration", "D": "Azure Arc onboarding for unmanaged devices"}, "answer": ["B"], "explanation": "Defender for Endpoint's Security Configuration Management feature (Preview/GA in recent releases) extends Intune Endpoint Security policies to devices that are onboarded to MDE but not fully Intune-enrolled.", "skill": "Configure endpoint security"}, {"id": "3-39", "exam": 3, "n": 39, "domain": "Optimize endpoint operations by using automation, monitoring, and reporting", "question": "A company needs to monitor Windows 11 device health and generate an alert when a device has not checked into Intune for more than 7 days. Which tool should you use to create this alert?", "options": {"A": "Create an Azure Monitor alert rule using Intune data exported to a Log Analytics workspace", "B": "Configure an Intune compliance policy with a non-compliance action triggering after 7 days of non-contact", "C": "Use the Intune built-in 'Devices not checking in' alert under Intune > Tenant administration > Roles", "D": "Configure a Microsoft Defender for Endpoint alert for device inactivity"}, "answer": ["A"], "explanation": "Azure Monitor with Log Analytics and Intune diagnostic settings allows creating custom alert rules for conditions like extended device inactivity that are not natively available as Intune built-in alerts.", "skill": "Monitor and optimize health"}, {"id": "3-40", "exam": 3, "n": 40, "domain": "Protect devices", "question": "You are reviewing Microsoft Secure Score recommendations for your Intune-managed Windows environment. A recommendation suggests enabling 'Microsoft Defender Antivirus PUA (Potentially Unwanted Applications) protection' in Block mode. Where should you configure this in Intune?", "options": {"A": "Endpoint Security > Attack Surface Reduction", "B": "Endpoint Security > Antivirus > Microsoft Defender Antivirus policy, setting 'Potentially Unwanted Application Action' to Block", "C": "Device Configuration > Settings Catalog > Microsoft Defender Antivirus > PUA Protection", "D": "Both B and C configure the same CSP and achieve the same result"}, "answer": ["D"], "explanation": "Both the Endpoint Security Antivirus policy and the Settings Catalog configure the same underlying Defender CSP for PUA protection. Either method works; the key is setting the action to Block rather than Audit.", "skill": "Configure endpoint security"}, {"id": "3-41", "exam": 3, "n": 41, "domain": "Prepare infrastructure for devices", "question": "A company uses Microsoft Intune and needs to configure Local Administrator Password Solution (LAPS) for Windows 11 devices to automatically manage and rotate local admin passwords. Which Intune feature should you use?", "options": {"A": "Deploy a PowerShell script to configure legacy LAPS registry settings", "B": "Configure Windows LAPS via Intune using the Endpoint Security > Account Protection > Local admin password solution (Windows LAPS) policy", "C": "Use Group Policy ADMX template imported into Intune for LAPS", "D": "Configure a custom OMA-URI for LAPS CSP settings"}, "answer": ["B"], "explanation": "Windows LAPS (introduced in Windows 11 22H2 / Windows 10 22H2) is natively supported in Intune via Endpoint Security > Account Protection, enabling cloud-backed LAPS with Microsoft Entra ID password storage.", "skill": "Implement identity and compliance"}, {"id": "3-42", "exam": 3, "n": 42, "domain": "Protect devices", "question": "A company's IT policy requires that Windows 11 updates are installed within 72 hours of release for critical security patches. The devices are managed by Intune Update Rings. How should you configure the Update Ring to meet this requirement?", "options": {"A": "Set quality update deferral to 0 days and active hours to allow immediate installation; set deadline for feature updates to 3 days", "B": "Set quality update deferral to 0 days and configure a deadline of 3 days for quality updates with a grace period of 0 hours for forced installation", "C": "Set quality update deferral to 3 days", "D": "Use the Expedited Updates feature for all patches with a 3-day deployment target"}, "answer": ["B"], "explanation": "Setting quality deferral to 0 days and a quality update deadline of 3 days with a 0-hour grace period ensures devices must install security patches within 72 hours of availability, with forced installation if needed.", "skill": "Manage device updates"}, {"id": "3-43", "exam": 3, "n": 43, "domain": "Protect devices", "question": "Your company is using Microsoft Defender for Cloud (formerly Azure Security Center) and wants to extend its security assessments to Windows 11 endpoints managed by Intune. Which Defender for Cloud feature enables this integration?", "options": {"A": "Defender for Cloud workload protection plans for servers", "B": "Microsoft Defender for Endpoint integration with Defender for Cloud via the Defender for Cloud Apps connector", "C": "Defender for Cloud's Foundational CSPM tier with Intune connector assessing endpoint security posture", "D": "Enable Defender for Servers on the endpoints for agent-based assessment"}, "answer": ["C"], "explanation": "Defender for Cloud's Foundational CSPM with Intune integration allows cloud security posture management recommendations to extend to endpoint devices, assessing their configuration against security benchmarks.", "skill": "Configure endpoint security", "note": "Unreliable: Defender for Cloud has no 'Intune connector' that assesses endpoints. Don't memorize this answer."}, {"id": "3-44", "exam": 3, "n": 44, "domain": "Optimize endpoint operations by using automation, monitoring, and reporting", "question": "You need to configure an automated response in Microsoft Sentinel when a Defender for Endpoint alert indicates a device is infected with malware. The response should automatically isolate the device. Which Microsoft Sentinel feature should you configure?", "options": {"A": "A Microsoft Sentinel Workbook dashboard displaying the alert", "B": "A Microsoft Sentinel Playbook (Logic App) triggered by the Defender alert that calls the Defender for Endpoint API to initiate device isolation", "C": "A custom Kusto analytics rule that marks the device as non-compliant", "D": "An Azure Automation runbook connected to Intune"}, "answer": ["B"], "explanation": "Microsoft Sentinel Playbooks are Azure Logic Apps that automate responses to incidents/alerts. A playbook triggered by a MDE malware alert can call the MDE isolate device API to automatically contain the threat.", "skill": "Automate management tasks"}, {"id": "3-45", "exam": 3, "n": 45, "domain": "Protect devices", "question": "A company needs to configure Microsoft Defender for Endpoint to scan network drives when users access them on their Windows 11 devices. By default, network drives are not scanned. Which Defender Antivirus setting should you configure via Intune?", "options": {"A": "Enable 'Scan removable drives' under the Defender Antivirus scan settings", "B": "Enable 'Scan mapped network drives during full scan' in the Microsoft Defender Antivirus policy via Intune Endpoint Security or Settings Catalog", "C": "Configure a scheduled scan task to scan network paths via PowerShell", "D": "Enable Network protection to scan all network traffic"}, "answer": ["B"], "explanation": "The 'Scan mapped network drives during full scan' setting in Defender Antivirus configuration enables scanning of network-mapped drives, which is disabled by default for performance reasons.", "skill": "Configure endpoint security", "note": "The on-access setting is 'Allow scanning of network files'. The keyed setting only applies to full scans of mapped drives."}];const N=55,PASS=0.7;
// Focus areas from the Oct 16, 2026 score report. Set FOCUS=[] to hide all flags.
const FOCUS=["Manage and maintain devices","Protect devices"];
const FOCUS_SKILLS=["Manage device updates","Configure endpoint security","Plan and implement device configuration profiles"];
const fq=q=>FOCUS_SKILLS.includes(q.skill)?"\u{1F6A9} ":"";
const flag=d=>FOCUS.includes(d)?'\u{1F6A9} ':'';
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let S;
function intro(){app.innerHTML=`<h1>MD-102 certification exam</h1><p class="sub">${N} questions weighted to match Microsoft's section percentages, drawn at random from all three practice exams. The bank has few Optimize endpoint operations questions, so that section may run short. No feedback until you submit. Pass mark: ${PASS*100}%.${FOCUS.length?' A \u{1F6A9} marks a focus area from your score report.':''}</p>
<div class="row ui"><button class="primary" id="go">Start exam</button><a class="link" href="index.html" style="padding:12px 6px">Back to study mode</a></div>`;
document.getElementById('go').onclick=()=>{S={deck:buildDeck(),i:0,ans:{},ask:false};test()}}
function test(){
  const q=S.deck[S.i],last=S.i===N-1,done=Object.keys(S.ans).length;
  const opts=Object.entries(q.options).map(([k,t])=>`<button class="opt ${S.ans[q.id]===k?'sel':''}" data-k="${k}" aria-pressed="${S.ans[q.id]===k}"><b>${k}</b><span>${esc(t)}</span></button>`).join('');
  const un=N-done;
  app.innerHTML=`<div class="bar ui"><span>Question ${S.i+1} of ${N}</span><span>${done} answered</span></div><div class="prog"><i style="width:${(S.i+1)/N*100}%"></i></div>
  <div class="q"><p>${esc(q.question)}</p>${opts}</div>
  ${S.ask?`<div class="warn ui">You have ${un} unanswered question${un>1?'s':''}. Unanswered questions count as wrong. Submit anyway?</div>`:''}
  <div class="nav ui"><button class="sec" id="prev" ${S.i?'':'disabled'}>Back</button>
  ${last?`<button class="primary" id="sub">${S.ask?'Yes, submit exam':'Submit exam'}</button>`:`<button class="primary" id="next">Next</button>`}</div>
  <div class="map" aria-label="Question navigator">${S.deck.map((d,j)=>`<button data-j="${j}" class="${S.ans[d.id]?'a':''} ${j===S.i?'c':''}" aria-label="Question ${j+1}">${j+1}</button>`).join('')}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[q.id]=b.dataset.k;S.ask=false;test()});
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;S.ask=false;test();scrollTo(0,0)});
  const go=d=>{S.i+=d;S.ask=false;test();scrollTo(0,0)};
  document.getElementById('prev').onclick=()=>go(-1);
  const n=document.getElementById('next');if(n)n.onclick=()=>go(1);
  const s=document.getElementById('sub');if(s)s.onclick=()=>{if(un>0&&!S.ask){S.ask=true;test();return}result()};
}
const DOM=[["Prepare infrastructure for devices","20\u201325%"],["Manage and maintain devices","25\u201330%"],["Protect devices","15\u201320%"],["Manage and secure applications","15\u201320%"],["Optimize endpoint operations by using automation, monitoring, and reporting","10\u201315%"]];
const TARGET=[12,16,10,10,7];
function buildDeck(){const by=DOM.map(([d])=>shuffle(BANK.filter(q=>q.domain===d)));
  const pick=by.map((a,i)=>a.slice(0,TARGET[i])).flat();
  const rest=shuffle(by.flatMap((a,i)=>a.slice(TARGET[i])));
  return shuffle(pick.concat(rest.slice(0,N-pick.length)))}
function chart(dd){
  const rows=DOM.map(([d,w])=>{const v=dd[d],p=v?v[0]/v[1]:0;
    return `<div class="brow"><div class="bl">${flag(d)}${d} (${w})</div><div class="bt">${v?(p>0?`<i style="width:${p*100}%"></i>`:''):'<span class="bn">No questions in this exam</span>'}</div><div class="bv">${v?v[0]+' / '+v[1]:''}</div></div>`}).join('');
  return `<h2 class="h2">Performance by exam section</h2><p class="sub">Each section and its percentage of the exam appears beside its bar. Longer bars mean stronger performance. Section sizes differ, so bars can't be added up to your total. No bar means no correct answers.</p>${rows}<div class="ax"><span>0%</span><span>100%</span></div>`}
function topSkills(){const k={};S.deck.forEach(q=>{const t=k[q.skill]=k[q.skill]||[0,0];t[1]++;if(S.ans[q.id]===q.answer[0])t[0]++});
  const w=Object.entries(k).filter(([,v])=>v[0]<v[1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]||b[1][1]-a[1][1]).slice(0,3);
  return w.length?`<h2 class="h2">Top 3 skill areas to prioritize</h2><p class="sub">Your weakest skills in this attempt:</p><ul>${w.map(([t,v])=>`<li>${FOCUS_SKILLS.includes(t)?'\u{1F6A9} ':''}${t} (${v[0]} of ${v[1]} correct)</li>`).join('')}</ul>`:''}
function result(){
  const ok=S.deck.filter(q=>S.ans[q.id]===q.answer[0]),pct=ok.length/N,pass=pct>=PASS;
  const dd={};S.deck.forEach(q=>{const d=dd[q.domain]=dd[q.domain]||[0,0];d[1]++;if(S.ans[q.id]===q.answer[0])d[0]++});
  S.filter='all';
  app.innerHTML=`<h1>${pass?'Passed':'Not passed'}</h1><div class="score">${ok.length} / ${N} <span style="font-size:22px;color:var(--mute)">${Math.round(pct*100)}%</span></div>
  <p class="sub">Passing score: 700. Your estimated score: ${Math.round(pct*1000)}. This is a practice estimate; Microsoft scales real scores and the pass line varies by exam form.${FOCUS.length?' \u{1F6A9} = focus from your score report: device updates, configuration profiles, endpoint security.':''}</p>
  ${chart(dd)}${topSkills()}
  <div class="row ui"><button class="primary" id="re">New exam</button><a class="link" href="index.html" style="padding:12px 6px">Study mode</a></div>
  <div class="mode ui" style="margin-top:26px"><button data-f="all" aria-pressed="true">All questions</button><button data-f="wrong" aria-pressed="false">Missed only</button></div><div id="rv"></div>`;
  document.getElementById('re').onclick=intro;
  const rv=()=>{document.getElementById('rv').innerHTML=S.deck.map((q,i)=>({q,i})).filter(({q})=>S.filter==='all'||S.ans[q.id]!==q.answer[0]).map(({q,i})=>{
    const a=S.ans[q.id],c=q.answer[0],good=a===c;
    const o=Object.entries(q.options).map(([k,t])=>`<button class="opt ${k===c?'ok':k===a?'bad':''}" disabled><b>${k}</b><span>${esc(t)}</span></button>`).join('');
    return `<div class="q"><p class="tag ${good?'ok':'bad'}">Question ${i+1}: ${good?'Correct':a?'Incorrect':'Unanswered'} (${fq(q)}${q.domain}: ${q.skill})</p><p>${esc(q.question)}</p>${o}<div class="fb ${good?'ok':'bad'}">${esc(q.explanation)}${q.note?'<br><br><strong>Review note:</strong> '+esc(q.note):''}</div></div>`}).join('')};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));rv()});
  rv();scrollTo(0,0);
}
intro();
</script></body></html>
